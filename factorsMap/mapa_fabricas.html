          <div style="height:100%;width:${pct.toFixed(1)}%;background:linear-gradient(90deg,#00c853,#64dd17);"></div>
        </div>
        <div style="margin-top:10px;font-size:13px;color:#ddd">${pct.toFixed(1)}% • ${carregadasSeguro.toLocaleString()} / ${totalSeguro.toLocaleString()} fábricas</div>
      </div>`;
    overlay.dataset.overlayMode = 'city-load';
    overlay.style.display = 'flex';
  };

  const progressoAnimado = {
    carregadas: 0,
    total: 0,
    etapa: 'Iniciando download dos dados...'
  };

  const animacaoOverlay = criarAnimadorProgressoSuave({
    onRender: (pct) => {
      atualizarOverlayCarregamentoCidade(
        pct,
        progressoAnimado.carregadas,
        progressoAnimado.total,
        progressoAnimado.etapa
      );
    }
  });

  const encerrarAnimacaoOverlay = () => {
    animacaoOverlay.stop();
  };

  const atualizarMetaProgresso = (targetPct, carregadas = 0, total = 0, etapa = 'Carregando dados da cidade', options = {}) => {
    const pct = Math.max(0, Math.min(100, Number(targetPct) || 0));
    progressoAnimado.carregadas = Math.max(0, Number(carregadas) || 0);
    progressoAnimado.total = Math.max(0, Number(total) || 0);
    progressoAnimado.etapa = etapa;
    animacaoOverlay.setTarget(pct, { allowComplete: options.allowComplete === true });
  };

  const aguardarAnimacaoAte = async (minPct = 99.8, timeoutMs = 2500) => {
    await animacaoOverlay.waitFor(minPct, timeoutMs, () => loadToken === _cityLoadTokenAtivo);
  };

  const STAGE_PCT = {
    dados: 45,
    preparar: 10,
    geocodificar: 20,
    marcadores: 23,
    finalizar: 2
  };

  const pctAteDados = (ratio) => STAGE_PCT.dados * Math.max(0, Math.min(1, ratio));
  const pctAtePreparar = STAGE_PCT.dados + STAGE_PCT.preparar;
  const pctAteGeocodificar = pctAtePreparar + STAGE_PCT.geocodificar;
  const pctAteMarcadores = pctAteGeocodificar + STAGE_PCT.marcadores;

  try {
    // Limpar conselhos da cidade anterior imediatamente ao trocar de cidade
    conselhosLayer.clearLayers();
    _conselhosCidadeAtual = [];

    atualizarMetaProgresso(0, 0, 0, 'Iniciando download dos dados...');

    let offset = 0;
    let total = 0;
    const novosEmpresas = [];

    while (true) {
      if (loadToken !== _cityLoadTokenAtivo) return;
      const r = await fetch(`/api/dados-cidade?nome=${encodeURIComponent(nomeUpper)}&paginado=1&offset=${offset}&limit=${CITY_LOAD_BATCH_SIZE}`);
      if (!r.ok) {
        if (loadToken === _cityLoadTokenAtivo) ocultarOverlayCarregamentoCidade();
        return false;
      }
      const payload = await r.json();
      if (loadToken !== _cityLoadTokenAtivo) return false;

      const items = Array.isArray(payload.items) ? payload.items : [];
      total = Number.isFinite(payload.total) ? payload.total : total;
      novosEmpresas.push(...items);
      offset += items.length;

      const ratioDados = total > 0 ? (offset / total) : 1;
      atualizarMetaProgresso(pctAteDados(ratioDados), offset, total || offset, 'Carregando fábricas da cidade...');

      if (!items.length || (total > 0 && offset >= total) || !payload.hasMore) break;
    }

    if (loadToken !== _cityLoadTokenAtivo) return false;
    if (!novosEmpresas.length) {
      encerrarAnimacaoOverlay();
      ocultarOverlayCarregamentoCidade();
      return false;
    }

    // Substituir array global de empresas
    empresas.length = 0;
    novosEmpresas.forEach(e => {
      e.cor = obterCorPorCapital(e.capital);
      empresas.push(e);
    });

    // Atualizar conjunto de empresas ativas
    empresasAtivasByCNPJ.clear();
    empresas.forEach(e => empresasAtivasByCNPJ.add(e.cnpj));

    // Atualizar contagem e label da cidade
    const cnpjUnicos = new Set(empresas.map(e => e.cnpj));
    document.getElementById('empresasCount').textContent = cnpjUnicos.size + ' empresas';
    const lbl = document.getElementById('cidadeAtualLabel');
    if (lbl) lbl.textContent = nomeCidade.charAt(0).toUpperCase() + nomeCidade.slice(1).toLowerCase();
    salvarUltimaCidadeMapa(nomeUpper);

    renderizarLista();
    // Atualizar gráfico se a aba Gráficos já estiver ativa
    if (document.getElementById('graficos') && document.getElementById('graficos').classList.contains('active')) {
      renderizarGrafico();
    }
    atualizarMetaProgresso(pctAtePreparar, novosEmpresas.length, total || novosEmpresas.length, 'Preparando lista e indicadores da cidade...');

    atualizarMetaProgresso(pctAtePreparar + 1, novosEmpresas.length, total || novosEmpresas.length, 'Carregando coordenadas dos endereços...');
    const cidadeJaAquecida = cidadeAquecida(nomeUpper);
    const coordenadas = await carregarCoordenadas(45000, {
      shouldContinue: () => loadToken === _cityLoadTokenAtivo,
      batchSize: cidadeJaAquecida ? 12 : 5,
      nomeCidade: nomeUpper,
      cityWarmed: cidadeJaAquecida,
      preferInstantOpen: true,
      onProgress: ({ processed, total: totalEnderecos }) => {
        if (loadToken !== _cityLoadTokenAtivo) return;
        const ratioGeo = totalEnderecos > 0 ? (processed / totalEnderecos) : 1;
        const pct = pctAtePreparar + (STAGE_PCT.geocodificar * Math.max(0, Math.min(1, ratioGeo)));
        atualizarMetaProgresso(pct, processed, totalEnderecos, 'Geocodificando endereços da cidade...');
      }
    });
    if (loadToken !== _cityLoadTokenAtivo) return false;
    atualizarMetaProgresso(pctAteGeocodificar, novosEmpresas.length, total || novosEmpresas.length, 'Coordenadas carregadas. Criando marcadores...');

    await criarMarcadoresComCoordenadasProgressivo(coordenadas || {}, {
      shouldContinue: () => loadToken === _cityLoadTokenAtivo,
      onProgress: ({ processadas, totalProcessamento }) => {
        if (loadToken !== _cityLoadTokenAtivo) return;
        const ratioMarcadores = totalProcessamento > 0 ? (processadas / totalProcessamento) : 1;
        const pct = pctAteGeocodificar + (STAGE_PCT.marcadores * ratioMarcadores);
        atualizarMetaProgresso(pct, processadas, totalProcessamento, 'Montando marcadores no mapa...');
      }
    });
    if (loadToken !== _cityLoadTokenAtivo) return false;

    atualizarMetaProgresso(pctAteMarcadores, novosEmpresas.length, total || novosEmpresas.length, 'Ajustando visualização final...');

    if (markerGroup.getLayers().length > 0) {
      map.fitBounds(markerGroup.getBounds().pad(0.1));
    } else {
      try {
        const ufInferida = (() => {
          for (const e of novosEmpresas) {
            const m = String(e.endereco || '').toUpperCase().match(/\/([A-Z]{2})\s*$/);
            if (m && m[1]) return m[1];
          }
          return '';
        })();
        const centroUrl = `/api/geocodificar-cidade?nome=${encodeURIComponent(nomeUpper)}${ufInferida ? `&uf=${encodeURIComponent(ufInferida)}` : ''}`;
        const centroResp = await fetch(centroUrl);
        if (loadToken === _cityLoadTokenAtivo && centroResp.ok) {
          const centro = await centroResp.json();
          if (Number.isFinite(centro.lat) && Number.isFinite(centro.lon)) {
            map.setView([centro.lat, centro.lon], 12);
          }
        }
      } catch (_) {}
    }

    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    atualizarMetaProgresso(100, novosEmpresas.length, total || novosEmpresas.length, 'Finalizando exibição da nova cidade...', { allowComplete: true });
    await aguardarAnimacaoAte(99.9, 2500);
    encerrarAnimacaoOverlay();
    atualizarOverlayCarregamentoCidade(100, novosEmpresas.length, total || novosEmpresas.length, 'Concluído');

    if (loadToken === _cityLoadTokenAtivo) ocultarOverlayCarregamentoCidade();
    _cidadeAtivaMapa = nomeUpper;
    // Carregar conselho da cidade imediatamente após as fábricas estarem no mapa
    if (typeof carregarConselhosMapa === 'function') {
      _conselhosCarregados[nomeUpper] = false;
      conselhosLayer.clearLayers();
      _conselhosCidadeAtual = [];
      carregarConselhosMapa(nomeUpper);
    }
    return true;
  } catch (e) {
    console.error('Erro ao carregar cidade no mapa:', e);
    encerrarAnimacaoOverlay();
    if (loadToken === _cityLoadTokenAtivo) ocultarOverlayCarregamentoCidade();
    return false;
  } finally {
    encerrarAnimacaoOverlay();
    if (loadToken === _cityLoadTokenAtivo) {
      _cityLoadTokenAtivo = 0;
    }
  }
}

async function fetchComTimeout(url, options = {}, timeoutMs = 20000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function cancelarProcessamento(nomeCidade = _cidadeAtiva) {
  const cidadeNome = (nomeCidade || _cidadeAtiva || '').toUpperCase();
  if (!cidadeNome) return;
  _cidadeAtiva = cidadeNome;
  const confirmou = confirm(`Tem certeza que deseja cancelar o processamento de ${cidadeNome}?`);
  if (!confirmou) return;
  const btn = document.getElementById('btn-cancelar');
  if (btn) { btn.disabled = true; btn.textContent = 'Cancelando…'; }
  try {
    const resp = await fetch('/api/cancelar-processamento', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ nome: cidadeNome })
    });
    const data = await resp.json();
    if (Array.isArray(data.pidsEncerrados) && data.pidsEncerrados.length) {
      anexarLinhasLog([`[CANCELAMENTO] PIDs encerrados: ${data.pidsEncerrados.join(', ')}`]);
    } else {
      anexarLinhasLog(['[CANCELAMENTO] Solicitação enviada. Aguardando confirmação...']);
    }
  } catch(e) { console.error('Erro ao cancelar:', e); }
}

function aplicarEstadoPausadoUI(nomeCidade, progressData = null) {
  const cidadeNome = (nomeCidade || _cidadeAtiva || '').toUpperCase();
  if (!cidadeNome) return;
  _cidadeAtiva = cidadeNome;
  _estadosMiniBarPorCidade[cidadeNome] = 'paused';
  _jobAtivo = false;
  if (_pollingInterval) { clearInterval(_pollingInterval); _pollingInterval = null; }
  _pollingCidadeSeq++;
  if (_recursosPollingInterval) { clearInterval(_recursosPollingInterval); _recursosPollingInterval = null; }

  if (progressData && (Number.isFinite(progressData.percent) || Number.isFinite(progressData.files_done))) {
    _percentualPorCidade[cidadeNome] = calcularPercentualArquivos(progressData);
    atualizarPainelProgresso(progressData, cidadeNome);
  }

  const btnPausar = document.getElementById('btn-pausar');
  const btnRetomar = document.getElementById('btn-retomar');
  const btnCancel = document.getElementById('btn-cancelar');
  if (btnPausar) btnPausar.style.display = 'none';
  if (btnRetomar) btnRetomar.style.display = 'inline-flex';
  if (btnCancel) btnCancel.style.display = 'inline-flex';
  atualizarEstadoJanelaCidade(cidadeNome, {
    visivel: true,
    ultimoStatus: 'paused',
    ultimoPercentual: Number.isFinite(_percentualPorCidade[cidadeNome]) ? _percentualPorCidade[cidadeNome] : 0
  });
  atualizarMiniBarProcessamento(cidadeNome);
}

async function carregarSnapshotProcessamento(nomeCidade, progressData = null) {
  const cidadeNome = (nomeCidade || '').toUpperCase();
  if (!cidadeNome) return;

  try {
    let progresso = progressData;
    if (!progresso) {
      const sr = await fetch(`/api/status-cidade?nome=${encodeURIComponent(cidadeNome)}`);
      const sd = await sr.json();
      progresso = sd && sd.progressData ? sd.progressData : null;
    }
    if (progresso) {
      if (Number.isFinite(progresso.percent) || Number.isFinite(progresso.files_done)) {
        _percentualPorCidade[cidadeNome] = calcularPercentualArquivos(progresso);
      }
      atualizarPainelProgresso(progresso, cidadeNome);
    }
  } catch (_) {}

  try {
    const logEl = document.getElementById('prog-log');
    if (logEl) logEl.innerHTML = '';
    const r = await fetch(`/api/log-cidade?nome=${encodeURIComponent(cidadeNome)}&offset=0`);
    const d = await r.json();
    if (Array.isArray(d.lines) && d.lines.length) anexarLinhasLog(d.lines);
    _logOffset = Number.isFinite(d.nextOffset) ? d.nextOffset : 0;
  } catch (_) {}
}

async function aguardarPausaConfirmada(nomeCidade, tentativas = 16) {
  const cidadeNome = (nomeCidade || '').toUpperCase();
  for (let i = 0; i < tentativas; i++) {
    try {
      const r = await fetch(`/api/progresso-cidade?nome=${encodeURIComponent(cidadeNome)}`);
      const d = await r.json();
      if (d && d.status === 'paused') return d;
    } catch (_) {}
    await new Promise(resolve => setTimeout(resolve, 700));
  }
  return null;
}

async function pausarProcessamento(nomeCidade = _cidadeAtiva) {
  const cidadeNome = (nomeCidade || _cidadeAtiva || '').toUpperCase();
  if (!cidadeNome) return;
  _cidadeAtiva = cidadeNome;
  const confirmou = confirm(`Deseja pausar o processamento de ${cidadeNome}?`);
  if (!confirmou) return;
  const btnP = document.getElementById('btn-pausar');
  if (btnP) { btnP.disabled = true; btnP.textContent = 'Pausando…'; }
  try {
    const resp = await fetch('/api/pausar-processamento', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ nome: cidadeNome })
    });
    const data = await resp.json();
    if (data.erro) {
      anexarLinhasLog([`[ERRO] ${data.erro}`]);
    } else {
      anexarLinhasLog(['[PAUSA] Solicitação de pausa enviada. Aguardando checkpoint seguro...']);
      const pausado = await aguardarPausaConfirmada(cidadeNome);
      if (pausado) {
        aplicarEstadoPausadoUI(cidadeNome, pausado);
        anexarLinhasLog([
          `[PAUSA] Processamento pausado em ${pausado.current_file || 'arquivo não informado'} na linha ${pausado.file_lines_done || 0}.`
        ]);
        await carregarSnapshotProcessamento(cidadeNome, pausado);
      }
    }
  } catch(e) {
    anexarLinhasLog([`[ERRO] Falha ao pausar: ${e.message}`]);
  } finally {
    if (btnP) { btnP.disabled = false; btnP.textContent = '⏸ Pausar'; }
  }
}

async function retomarProcessamento(nomeCidade = _cidadeAtiva) {
  const cidadeNome = (nomeCidade || _cidadeAtiva || '').toUpperCase();
  if (!cidadeNome) return;
  const codigoCidade = _codigoCidadePorCidade[cidadeNome] || _codigoCidadeAtiva;
  if (!codigoCidade) return;
  _cidadeAtiva = cidadeNome;
  _codigoCidadeAtiva = codigoCidade;
  const btnR = document.getElementById('btn-retomar');
  if (btnR) { btnR.disabled = true; btnR.textContent = 'Retomando…'; }
  try {
    const resp = await fetch('/api/retomar-processamento', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ nome: cidadeNome, codigo: codigoCidade })
    });
    const data = await resp.json();
    if (data.erro) {
      anexarLinhasLog([`[ERRO] ${data.erro}`]);
      return;
    }
    anexarLinhasLog(['[RETOMADA] Processamento retomado a partir do checkpoint.']);
    aplicarEstadoProcessandoUI(cidadeNome);
    iniciarPollingProgresso(cidadeNome);
  } catch(e) {
    anexarLinhasLog([`[ERRO] Falha ao retomar: ${e.message}`]);
  } finally {
    if (btnR) { btnR.disabled = false; btnR.textContent = '▶ Retomar'; }
  }
}

async function sincronizarEstadoCidadeComServidor(nomeCidade) {
  const cidadeNome = (nomeCidade || '').toUpperCase();
  if (!cidadeNome) return false;
  try {
    const r = await fetch(`/api/status-cidade?nome=${encodeURIComponent(cidadeNome)}`);
    const status = await r.json();
    if (status.emProcessamento) {
      mostrarPainelProgresso(cidadeNome);
      aplicarEstadoProcessandoUI(cidadeNome, status.progressData || null);
      iniciarPollingProgresso(cidadeNome);
      return true;
    }
    if (status.pausado || (status.progressData && status.progressData.status === 'paused')) {
      mostrarPainelProgresso(cidadeNome);
      await carregarSnapshotProcessamento(cidadeNome, status.progressData || null);
      aplicarEstadoPausadoUI(cidadeNome, status.progressData || null);
      anexarLinhasLog(['[PAUSA] Processamento pausado. Clique em "Retomar" para continuar do checkpoint.']);
      return true;
    }
  } catch (_) {}
  return false;
}

// Inicia o processamento depois da confirmação
async function confirmarProcessamento(nomeCidade, codigo) {
  _codigoCidadeAtiva = codigo;
  _codigoCidadePorCidade[(nomeCidade || '').toUpperCase()] = codigo;
  mostrarPainelProgresso(nomeCidade);
  try {
    const r = await fetch('/api/processar-cidade', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ nome: nomeCidade, codigo })
    });
    const result = await r.json();
    if (result.erro) {
      const inner = document.getElementById('overlay-inner');
      if (inner) inner.innerHTML += `<div style="color:#f44336;font-size:13px;margin-top:12px">❌ ${result.erro}</div>`;
      return;
    }
    iniciarPollingProgresso(nomeCidade);
  } catch(e) {
    const inner = document.getElementById('overlay-inner');
    if (inner) inner.innerHTML += `<div style="color:#f44336;font-size:13px;margin-top:12px">❌ ${e.message}</div>`;
  }
}

// Função principal chamada pelo autocomplete
async function filtrarPorCidade(nomeCidade) {
  const nomeUpper = nomeCidade.toUpperCase();
  const codigo = codigoCidades[nomeUpper];
  _codigoCidadeAtiva = codigo;
  _codigoCidadePorCidade[nomeUpper] = codigo;
  if (!codigo) {
    alert(`Cidade "${nomeCidade}" não encontrada no índice.`);
    return;
  }

  // Verificar se já há um processo ativo para esta cidade (reconnect)
  const statusR = await fetch(`/api/status-cidade?nome=${encodeURIComponent(nomeUpper)}`);
  const status  = await statusR.json();

  if (status.completo) {
    // Dados prontos — carregar diretamente no mapa
    await carregarCidadeNoMapa(nomeCidade);
    return;
  }

  if (status.emProcessamento) {
    // Reconectar ao processo em andamento
    mostrarPainelProgresso(nomeUpper);
    const overlay = document.getElementById('processamento-overlay');
    if (overlay) overlay.style.display = 'flex';
    if (status.progressData) atualizarPainelProgresso(status.progressData, nomeUpper);
    iniciarPollingProgresso(nomeUpper);
    return;
  }

  if (status.pausado || (status.progressData && status.progressData.status === 'paused')) {
    mostrarPainelProgresso(nomeUpper);
    await carregarSnapshotProcessamento(nomeUpper, status.progressData || null);
    aplicarEstadoPausadoUI(nomeUpper, status.progressData || null);
    anexarLinhasLog(['[PAUSA] Processamento pausado. Clique em "Retomar" para continuar do checkpoint.']);
    return;
  }

  // Nenhum dado, nenhum processo — pedir confirmação
  mostrarConfirmacao(nomeCidade, codigo);
}

// Ao carregar a página, verificar se há processamento em andamento (reconnect automático)
async function verificarProcessamentoAtivo() {
  // Lê a URL ?cidade= se houver
  const params = new URLSearchParams(window.location.search);
  const cidadeParam = params.get('cidade');
  if (cidadeParam) {
    const nomeUpper = cidadeParam.toUpperCase();
    try {
      const r = await fetch(`/api/status-cidade?nome=${encodeURIComponent(nomeUpper)}`);
      const s = await r.json();
      if (s.emProcessamento) {
        mostrarPainelProgresso(nomeUpper);
        const overlay = document.getElementById('processamento-overlay');
        if (overlay) overlay.style.display = 'flex';
        if (s.progressData) atualizarPainelProgresso(s.progressData, nomeUpper);
        _codigoCidadeAtiva = codigoCidades[nomeUpper] || _codigoCidadeAtiva;
        iniciarPollingProgresso(nomeUpper);
      } else if (s.pausado || (s.progressData && s.progressData.status === 'paused')) {
        mostrarPainelProgresso(nomeUpper);
        const overlay = document.getElementById('processamento-overlay');
        if (overlay) overlay.style.display = 'flex';
        await carregarSnapshotProcessamento(nomeUpper, s.progressData || null);
        aplicarEstadoPausadoUI(nomeUpper, s.progressData || null);
        _cidadeAtiva = nomeUpper;
        _codigoCidadeAtiva = codigoCidades[nomeUpper] || _codigoCidadeAtiva;
        anexarLinhasLog(['[PAUSA] Processamento pausado. Clique em "Retomar" para continuar do checkpoint.']);
      }
    } catch(_) {}
  }
}

async function restaurarProcessamentosPersistidos() {
  carregarEstadoJanelasProcessamento();
  try {
    const r = await fetch('/api/processamentos');
    const d = await r.json();
    const itensServidor = Array.isArray(d.itens) ? d.itens : [];
    const mapa = new Map(itensServidor.map(i => [String(i.nomeCidade || '').toUpperCase(), i]));
    const cidadesPersistidasVisiveis = Object.keys(_estadoJanelasProcessamento || {})
      .map(nome => String(nome || '').toUpperCase())
      .filter(nome => !!nome)
      .filter(nome => {
        const estado = _estadoJanelasProcessamento[nome] || {};
        return estado.visivel !== false;
      });

    const cidadesCandidatas = Array.from(new Set([
      ...Array.from(mapa.keys()),
      ...cidadesPersistidasVisiveis
    ]));

    if (!cidadesCandidatas.length) return;

    const cidadesMaximizadas = [];

    for (const cidade of cidadesCandidatas) {
      if (!cidade) continue;
      let item = mapa.get(cidade) || null;
      if (!item) {
        try {
          const sr = await fetch(`/api/status-cidade?nome=${encodeURIComponent(cidade)}`);
          const status = await sr.json();
          const ativo = !!status.emProcessamento || !!status.pausado || !!status.podeRetomar;
          if (!ativo) continue;
          item = {
            nomeCidade: cidade,
            codigoCidade: codigoCidades[cidade] || null,
            emProcessamento: !!status.emProcessamento,
            pausado: !!status.pausado,
            podeRetomar: !!status.podeRetomar,
            progressData: status.progressData || null
          };
          mapa.set(cidade, item);
        } catch (_) {
          continue;
        }
      }

      const estadoSalvo = _estadoJanelasProcessamento[cidade] || { minimizada: true, visivel: true };
      const visivel = estadoSalvo.visivel !== false;
      if (!visivel) continue;

      if (!item) {
        const ultimoStatus = String(estadoSalvo.ultimoStatus || '').toLowerCase();
        const ultimoPercentual = Number.isFinite(estadoSalvo.ultimoPercentual) ? estadoSalvo.ultimoPercentual : 0;
        if (ultimoStatus === 'paused' || ultimoStatus === 'processing') {
          item = {
            nomeCidade: cidade,
            codigoCidade: codigoCidades[cidade] || null,
            emProcessamento: ultimoStatus === 'processing',
            pausado: ultimoStatus === 'paused',
            podeRetomar: ultimoStatus === 'paused',
            progressData: {
              status: ultimoStatus === 'paused' ? 'paused' : 'running',
              percent: ultimoPercentual,
              stage: ultimoStatus === 'paused' ? 'PAUSADO (restaurado)' : 'PROCESSANDO (restaurado)'
            }
          };
          mapa.set(cidade, item);
        } else {
          continue;
        }
      }

      _codigoCidadePorCidade[cidade] = item.codigoCidade || codigoCidades[cidade] || _codigoCidadePorCidade[cidade] || null;
      _percentualPorCidade[cidade] = Number.isFinite(item.progressData && item.progressData.percent)
        ? item.progressData.percent
        : 0;
      _estadosMiniBarPorCidade[cidade] = item.pausado ? 'paused' : 'processing';

      if (estadoSalvo.minimizada === false) cidadesMaximizadas.push(cidade);
      else mostrarMiniBarProcessamento(cidade);
    }

    let cidadeParaAbrir = null;
    for (const c of cidadesMaximizadas) {
      if (mapa.has(c)) { cidadeParaAbrir = c; break; }
    }

    if (cidadeParaAbrir) {
      const item = mapa.get(cidadeParaAbrir);
      await reabrirOverlayProcessamento(cidadeParaAbrir, {
        progressData: item.progressData || null,
        autoPolling: !!item.emProcessamento
      });
      if (!item.emProcessamento && item.pausado) {
        await carregarSnapshotProcessamento(cidadeParaAbrir, item.progressData || null);
        aplicarEstadoPausadoUI(cidadeParaAbrir, item.progressData || null);
      }
    }
  } catch (_) {}
}

// Função para formatar capital
function formatarCapital(valor) {
  if (valor >= 1000000000) return (valor / 1000000000).toFixed(2) + " Bi";
  return (valor / 1000000).toFixed(2) + " Mi";
}

function formatarEnderecoComBairro(empresa) {
  const enderecoBase = String((empresa && empresa.endereco) || '').trim();
  const bairro = String((empresa && empresa.bairro) || '').trim();
  if (!enderecoBase) return '';
  if (!bairro || /^NA$/i.test(bairro)) return enderecoBase;

  const idxSeparador = enderecoBase.lastIndexOf(' - ');
  if (idxSeparador < 0) return `${enderecoBase}, ${bairro}`;

  const prefixo = enderecoBase.slice(0, idxSeparador).trim();
  const sufixo = enderecoBase.slice(idxSeparador + 3).trim();
  if (new RegExp(`\\b${bairro.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')}\\b`, 'i').test(prefixo)) {
    return enderecoBase;
  }
  return `${prefixo}, ${bairro} - ${sufixo}`;
}

// Função para extrair nome da cidade do endereço
function extrairCidadeDoEndereco(endereco) {
  if (!endereco) return null;
  // Formato esperado: "RUA X, 123 - CIDADE/UF"
  const match = endereco.match(/\-\s*([A-Z\s]+)\/[A-Z]{2}\s*$/);
  if (match && match[1]) {
    return match[1].trim();
  }
  return null;
}

// Intervalo de capital usado para mapear a rotação das pirâmides
const capitalValores = empresas.map(e => e.capital);
const capitalMin = Math.min(...capitalValores);
const capitalMax = Math.max(...capitalValores);
const rotacaoMinRPS = 0.3;  // rotações por segundo
const rotacaoMaxRPS = 1.5;

function calcularRotacaoPorCapital(capital) {
  if (!Number.isFinite(capitalMin) || !Number.isFinite(capitalMax)) return rotacaoMinRPS;
  if (capitalMax === capitalMin) return rotacaoMaxRPS;
  const t = Math.max(0, Math.min(1, (capital - capitalMin) / (capitalMax - capitalMin)));
  return rotacaoMinRPS + (rotacaoMaxRPS - rotacaoMinRPS) * t;
}

// --- Pirâmide SVG animada (adaptada do snippet fornecido) ---

function hexToRgb(hex) {
  hex = hex.replace("#", "");
  return {
    r: parseInt(hex.substring(0, 2), 16),
    g: parseInt(hex.substring(2, 4), 16),
    b: parseInt(hex.substring(4, 6), 16)
  };
}

function shadeColor(hex, factor) {
  const { r, g, b } = hexToRgb(hex);

  if (factor <= 1) {
    return `rgb(${Math.min(255, r * factor)}, ${Math.min(255, g * factor)}, ${Math.min(255, b * factor)})`;
  }

  const t = factor - 1;
  return `rgb(${Math.min(255, r + (255 - r) * t)}, ${Math.min(255, g + (255 - g) * t)}, ${Math.min(255, b + (255 - b) * t)})`;
}

class Pyramid {
  constructor({
    x,
    y,
    size,
    height,
    color,
    rotationSpeed = 0.2, // rotações por segundo
    brightness = 256,
    transparency = 256,
    svgRoot,
    viewportWidth = 120,
    viewportHeight = 140
  }) {
    if (!svgRoot) throw new Error('svgRoot é obrigatório para renderizar a pirâmide');

    this.cx = x;
    this.cy = y;
    this.size = size;
    this.height = height;
    this.baseColor = color;

    this.svg = svgRoot;
    this.svg.setAttribute('viewBox', `0 0 ${viewportWidth} ${viewportHeight}`);
    this.svg.setAttribute('width', viewportWidth);
    this.svg.setAttribute('height', viewportHeight);

    // converte para radianos por segundo
    this.rotationSpeed = rotationSpeed * Math.PI * 2;

    this.globalBrightness = brightness / 256;
    this.opacity = transparency / 256;

    this.angle = 0;
    this.startTime = performance.now();
    this.lastTime = performance.now();

    this.vertices = [
      [-size, 0, -size],
      [size, 0, -size],
      [size, 0, size],
      [-size, 0, size],
      [0, height, 0]
    ];

    this.faces = [
      [0, 1, 4],
      [1, 2, 4],
      [2, 3, 4],
      [3, 0, 4],
      [0, 1, 2, 3]
    ];

    this.group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    this.svg.appendChild(this.group);

    // Neon glow: ellipse com blur abaixo da pirâmide, sincronizada com o pulse
    const filterId = 'nglow-' + Math.random().toString(36).substr(2, 8);
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    defs.innerHTML = `<filter id="${filterId}"><feGaussianBlur stdDeviation="5"/></filter>`;
    this.svg.insertBefore(defs, this.group);
    this.glowEl = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
    this.glowEl.setAttribute('cx', String(x));
    this.glowEl.setAttribute('cy', String(y - height * 0.45 + size * 1.4));
    this.glowEl.setAttribute('rx', String(size * 1.8));
    this.glowEl.setAttribute('ry', String(size * 1.4));
    this.glowEl.setAttribute('fill', color);
    this.glowEl.setAttribute('filter', `url(#${filterId})`);
    this.glowEl.setAttribute('fill-opacity', '0');
    this.svg.insertBefore(this.glowEl, this.group);

    this.polygons = this.faces.map(() => {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      p.setAttribute('stroke', 'none');
      p.setAttribute('stroke-linejoin', 'round');
      this.group.appendChild(p);
      return p;
    });

    this.animate();
  }

  rotateY([x, y, z], a) {
    return [x * Math.cos(a) - z * Math.sin(a), y, x * Math.sin(a) + z * Math.cos(a)];
  }

  rotateX([x, y, z], a) {
    return [x, y * Math.cos(a) - z * Math.sin(a), y * Math.sin(a) + z * Math.cos(a)];
  }

  project([x, y, z]) {
    const distance = 900;
    const scale = distance / (distance - z);
    return [this.cx + x * scale, this.cy + y * scale];
  }

  computeNormal(v1, v2, v3) {
    const ux = v2[0] - v1[0];
    const uy = v2[1] - v1[1];
    const uz = v2[2] - v1[2];

    const vx = v3[0] - v1[0];
    const vy = v3[1] - v1[1];
    const vz = v3[2] - v1[2];

    return [uy * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy * vx];
  }

  animate() {
    const now = performance.now();
    const delta = (now - this.lastTime) / 1000;
    this.lastTime = now;

    this.angle += this.rotationSpeed * delta;

    const t = (now - this.startTime) / 1000;

    // frequência baseada na rotação
    const rotationsPerSecond = this.rotationSpeed / (Math.PI * 2);

    const pulseAmplitude = 0.18;

    const pulse = 1 + pulseAmplitude * Math.sin(2 * Math.PI * rotationsPerSecond * t);
    const pulseNorm = 0.5 + 0.5 * ((pulse - 1) / pulseAmplitude);
    const pulseEscuro = pulse - 0.06 * (1 - pulseNorm);

    // Glow neon: oscila em sincronia com o pulse (mesma frequência e fase)
    this.glowEl.setAttribute('fill-opacity', String((0.015 + 0.0975 * pulseNorm).toFixed(3)));

    const rotated = this.vertices.map(v => {
      let r = this.rotateY(v, this.angle);
      r = this.rotateY(r, Math.PI / 4);
      r = this.rotateX(r, -Math.PI / 5);
      return r;
    });

    const faceData = this.faces.map((face, i) => {
      const avgZ = face.reduce((s, idx) => s + rotated[idx][2], 0) / face.length;
      return { index: i, avgZ };
    });

    faceData.sort((a, b) => a.avgZ - b.avgZ);

    faceData.forEach((data) => {
      const face = this.faces[data.index];
      const polygon = this.polygons[data.index];
      let fillColor;

      const projected = face.map(idx => this.project(rotated[idx]));
      polygon.setAttribute('points', projected.map(p => p.join(',')).join(' '));

      if (face.length === 3) {
        const normal = this.computeNormal(rotated[face[0]], rotated[face[1]], rotated[face[2]]);

        const len = Math.hypot(...normal);
        const n = normal.map(v => v / len);

        // luz vindo de cima
        const lightDir = [0.3, 1, -0.5];
        const lightLen = Math.hypot(...lightDir);
        const l = lightDir.map(v => v / lightLen);

        let dot = n[0] * l[0] + n[1] * l[1] + n[2] * l[2];
        dot = Math.max(0, dot);

        const ambient = 0.55;
        let brightness = ambient + dot * 0.85;

        brightness *= this.globalBrightness * pulseEscuro;

        fillColor = shadeColor(this.baseColor, brightness);
      } else {
        fillColor = shadeColor(this.baseColor, 0.6 * this.globalBrightness * pulseEscuro);
      }

      polygon.setAttribute('fill', fillColor);

      if (face.length === 3) {
        polygon.setAttribute('fill-opacity', String(Math.max(0.2, this.opacity * 0.35)));
        polygon.setAttribute('stroke', fillColor);
        polygon.setAttribute('stroke-opacity', '1');
        polygon.setAttribute('stroke-width', '1.2');
      } else {
        polygon.setAttribute('fill-opacity', this.opacity);
        polygon.setAttribute('stroke', 'none');
      }

      this.group.appendChild(polygon);
    });

    requestAnimationFrame(() => this.animate());
  }
}

function criarIconePiramide() {
  const html = '<div class="pyramid-wrapper"><svg class="pyramid-svg"></svg></div>';
  return L.divIcon({
    className: 'leaflet-div-icon pyramid-icon',

    iconAnchor: [40, 80],
    popupAnchor: [0, -70]
  });
}

function criarIconeClassico(cor) {
  const iconSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 24 30">
    <path d="M12 2C6.48 2 2 6.48 2 12c0 4.41 3.05 8.1 7.01 8.93V28h-6v2h16v-2h-6v-4.07C18.95 20.1 22 16.41 22 12c0-5.52-4.48-10-10-10z" stroke="#fff" stroke-width="1" fill="${cor}"/>
  </svg>`;
  const encodedSVG = btoa(iconSVG);
  return L.icon({ iconUrl: "data:image/svg+xml;base64," + encodedSVG, iconSize: [32, 40], iconAnchor: [16, 40], popupAnchor: [0, -40] });
}

// Função para obter cor da escala de capital
function obterCorPorCapital(capital) {
  if (capital < 10000000) return '#00FF00';
  if (capital < 50000000) return '#00DD00';
  if (capital < 100000000) return '#99DD00';
  if (capital < 500000000) return '#CCDD00';
  if (capital < 1000000000) return '#FFDD00';
  if (capital < 10000000000) return '#FFAA00';
  if (capital < 50000000000) return '#FF7700';
  if (capital < 100000000000) return '#FF3300';
  return '#FF0000';
}

function iniciarPiramideNoMarcador(marker, cor, capital) {
  const iniciar = () => {

    if (!el) return;
    const svgRoot = el.querySelector('.pyramid-svg');
    if (!svgRoot) return;

    new Pyramid({
      svgRoot,
      x: 40,
      y: 70,
      size: 18,
      height: 38,
      color: cor,
      rotationSpeed: rotacao,
      brightness: 256,
      transparency: 220,
      viewportWidth: 80,
      viewportHeight: 100
    });
  };

  if (marker.getElement()) {
    iniciar();
  } else {
    marker.once('add', iniciar);

// ─── Cluster: formatação de número abreviado ─────────────────────────────────
function _clusterFormatCount(n) {
  if (n >= 1e12) return (n / 1e12).toFixed(n >= 10e12 ? 0 : 1).replace(/\.0$/, '') + 'T';
  if (n >= 1e9)  return (n / 1e9).toFixed(n >= 10e9 ? 0 : 1).replace(/\.0$/, '') + 'B';
  if (n >= 1e6)  return (n / 1e6).toFixed(n >= 10e6 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3)  return (n / 1e3).toFixed(n >= 10e3 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return String(n);
}

// ─── Cluster: calcular raio do círculo (escala logarítmica) ──────────────────
function _clusterRadius(count) {
  const minR = 18, maxR = 50;
  const logCount = Math.log10(Math.max(10, count));
  const logMin = 1;   // log10(10)
  const logMax = 12;  // log10(1e12)
  const t = Math.min(1, (logCount - logMin) / (logMax - logMin));
  return Math.round(minR + t * (maxR - minR));
}

// ─── Cluster: cor do círculo por nível ───────────────────────────────────────
function _clusterColor(count) {
  if (count < 50)     return 'rgba(0,180,255,0.7)';
  if (count < 250)    return 'rgba(0,200,150,0.7)';
  if (count < 1000)   return 'rgba(80,220,80,0.7)';
  if (count < 5000)   return 'rgba(200,200,0,0.7)';
  if (count < 25000)  return 'rgba(255,170,0,0.7)';
  if (count < 100000) return 'rgba(255,100,0,0.7)';
  return 'rgba(255,50,50,0.7)';
}

const markerGroup = L.featureGroup().addTo(map);

// ─── Agrupamento visual customizado por zoom ─────────────────────────────────
const _clusterLayer = L.layerGroup().addTo(map);
const CLUSTER_ZOOM_THRESHOLD = 14; // abaixo desse zoom, agrupa; acima, mostra individuais
const CLUSTER_GRID_SIZE = 80; // pixels de grid para agrupar marcadores

function _markerShow(marker) {
  marker.setOpacity(1);
  var el = marker.getElement();
  if (el) el.style.pointerEvents = '';
}
function _markerHide(marker) {
  marker.setOpacity(0);
  var el = marker.getElement();
  if (el) el.style.pointerEvents = 'none';
}

function _atualizarClusters() {
  var zoom = map.getZoom();

  if (zoom >= CLUSTER_ZOOM_THRESHOLD) {
    // Zoom próximo: mostrar marcadores individuais, esconder clusters
    _clusterLayer.clearLayers();
    Object.keys(markers).forEach(function(idx) {
      if (markers[idx] && markers[idx].marker) _markerShow(markers[idx].marker);
    });
    return;
  }

  // Zoom afastado: esconder todos os individuais primeiro
  Object.keys(markers).forEach(function(idx) {
    if (markers[idx] && markers[idx].marker) _markerHide(markers[idx].marker);
  });

  _clusterLayer.clearLayers();

  // Agrupar marcadores por grid de pixels
  // Cada marcador pertence a exatamente uma célula — sem duplicação possível
  var grid = {};
  Object.keys(markers).forEach(function(idx) {
    var m = markers[idx];
    if (!m || !m.marker) return;
    var ll = m.marker.getLatLng();
    var pt = map.latLngToContainerPoint(ll);
    var gx = Math.floor(pt.x / CLUSTER_GRID_SIZE);
    var gy = Math.floor(pt.y / CLUSTER_GRID_SIZE);
    var key = gx + ':' + gy;
    if (!grid[key]) grid[key] = { lats: [], lngs: [], indices: [], count: 0 };
    grid[key].lats.push(ll.lat);
    grid[key].lngs.push(ll.lng);
    grid[key].indices.push(idx);
    grid[key].count++;
  });

  Object.keys(grid).forEach(function(key) {
    var g = grid[key];

    if (g.count === 1) {
      // Marcador isolado: mostrar normalmente
      var m = markers[g.indices[0]];
      if (m && m.marker) _markerShow(m.marker);
      return;
    }

    var lat = g.lats.reduce(function(a, b) { return a + b; }, 0) / g.count;
    var lng = g.lngs.reduce(function(a, b) { return a + b; }, 0) / g.count;

    // Criar circulo de cluster
    var r = _clusterRadius(g.count);
    var d = r * 2;
    var color = _clusterColor(g.count);
    var fontSize = r < 22 ? 11 : (r < 30 ? 12 : (r < 40 ? 13 : 14));
    var label = _clusterFormatCount(g.count);
    var icon = L.divIcon({
      html: '<div style="' +
        'width:' + d + 'px;height:' + d + 'px;' +
        'border-radius:50%;' +
        'background:' + color + ';' +
        'border:2px solid rgba(255,255,255,0.8);' +
        'display:flex;align-items:center;justify-content:center;' +
        'color:#fff;font-weight:bold;font-size:' + fontSize + 'px;' +
        'text-shadow:0 1px 3px rgba(0,0,0,0.6);' +
        'box-shadow:0 0 8px rgba(0,0,0,0.3);' +
        'cursor:pointer;' +
        '">' + label + '</div>',
      className: '',
      iconSize: L.point(d, d),
      iconAnchor: L.point(r, r)
    });
    var clusterBounds = L.latLngBounds(g.lats.map(function(lt, i) { return [lt, g.lngs[i]]; }));
    var clusterMarker = L.marker([lat, lng], { icon: icon, interactive: true });
    clusterMarker.on('click', function() {
      if (clusterBounds.isValid()) map.fitBounds(clusterBounds.pad(0.3));
    });
    _clusterLayer.addLayer(clusterMarker);
  });
}

// Função para carregar coordenadas do servidor (com cache)
function geocodificarPendentesEmSegundoPlano(enderecosPendentes, nomeCidade, batchSize, timeoutMs) {
  const cidade = String(nomeCidade || '').toUpperCase().trim();
  if (!cidade || !Array.isArray(enderecosPendentes) || enderecosPendentes.length === 0) return;
  if (_geocodingBackgroundCities.has(cidade)) return;

  _geocodingBackgroundCities.add(cidade);
  (async () => {
    try {
      for (let i = 0; i < enderecosPendentes.length; i += batchSize) {
        const lote = enderecosPendentes.slice(i, i + batchSize);
        const timeoutLoteMs = Math.max(timeoutMs, (lote.length * 3500) + 10000);
        try {
          await fetchComTimeout('/api/geocodificar-todos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enderecos: lote, nomeCidade: cidade })
          }, timeoutLoteMs);
        } catch (_) {}
      }
      console.log(`⏳ Geocodificação em segundo plano concluída para ${cidade}`);
    } finally {
      _geocodingBackgroundCities.delete(cidade);
    }
  })();
}

async function carregarCoordenadas(timeoutMs = 20000, options = {}) {
  const onProgress = typeof options.onProgress === 'function' ? options.onProgress : () => {};
  const shouldContinue = typeof options.shouldContinue === 'function' ? options.shouldContinue : () => true;
  const nomeCidade = String(options.nomeCidade || '').toUpperCase().trim();
  const preferInstantOpen = options.preferInstantOpen !== false;
  const cityWarmed = options.cityWarmed === true;
  const batchSize = Number.isFinite(options.batchSize)
    ? Math.max(1, Math.floor(options.batchSize))
    : (cityWarmed ? 12 : 5);
  const instantThreshold = Number.isFinite(options.instantThreshold)
    ? Math.max(0, Math.min(1, options.instantThreshold))
    : 0.85;
  try {
    // Fallback imediato: usar coordenadas já embutidas, se existirem
    const coordsEmbutidos = empresas.reduce((acc, e) => {
      if (e.coordenadas && Number.isFinite(e.coordenadas.lat) && Number.isFinite(e.coordenadas.lon)) {
        acc[e.endereco] = { lat: e.coordenadas.lat, lon: e.coordenadas.lon };
      }
      return acc;
    }, {});

    // Extrair endereços únicos
    const enderecosUnicos = [...new Set(empresas.map(e => e.endereco))];
    const enderecosFalhaConhecida = new Set(
      empresas
        .filter(e => e && e.geocode_failed === true && e.endereco)
        .map(e => e.endereco)
    );
    const enderecosPendentes = enderecosUnicos.filter(endereco => !coordsEmbutidos[endereco] && !enderecosFalhaConhecida.has(endereco));
    console.log(`📍 Carregando ${enderecosUnicos.length} endereços únicos do servidor...`);

    const coordenadas = {};
    const resolvidosIniciais = Object.keys(coordsEmbutidos).length + enderecosFalhaConhecida.size;
    const coberturaInicial = enderecosUnicos.length > 0 ? (resolvidosIniciais / enderecosUnicos.length) : 1;
    let processados = enderecosUnicos.length - enderecosPendentes.length;
    onProgress({ processed: processados, total: enderecosUnicos.length });

    if (enderecosPendentes.length === 0) {
      if (nomeCidade) marcarCidadeAquecida(nomeCidade);
      console.log('✅ Todas as coordenadas já estavam disponíveis no dataset.');
      return coordsEmbutidos;
    }

    if (preferInstantOpen && (cityWarmed || coberturaInicial >= instantThreshold)) {
      geocodificarPendentesEmSegundoPlano(enderecosPendentes, nomeCidade, batchSize, timeoutMs);
      onProgress({ processed: enderecosUnicos.length, total: enderecosUnicos.length });
      if (nomeCidade) marcarCidadeAquecida(nomeCidade);
      console.log(`⚡ Abertura instantânea com ${Object.keys(coordsEmbutidos).length} coordenadas já conhecidas; pendências seguirão em segundo plano.`);
      return coordsEmbutidos;
    }

    for (let i = 0; i < enderecosPendentes.length; i += batchSize) {
      if (!shouldContinue()) return { ...coordsEmbutidos, ...coordenadas };
      const lote = enderecosPendentes.slice(i, i + batchSize);
      const timeoutLoteMs = Math.max(timeoutMs, (lote.length * 3500) + 10000);

      try {
        const response = await fetchComTimeout('/api/geocodificar-todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enderecos: lote, nomeCidade })
        }, timeoutLoteMs);

        if (!response.ok) {
          console.error('Servidor retornou erro:', response.status);
        } else {
          const parcial = await response.json();
          Object.assign(coordenadas, parcial || {});
        }
      } catch (err) {
        console.warn(`Falha no lote de geocodificação (${lote.length} endereços):`, err.message || err);
      }

      processados += lote.length;
      onProgress({ processed: processados, total: enderecosUnicos.length });
    }

    console.log(`✅ Carregadas ${Object.keys(coordenadas).length} coordenadas`);
    if (nomeCidade) marcarCidadeAquecida(nomeCidade);
    // Priorizar resposta do servidor, mas complementar com fallback local
    return { ...coordsEmbutidos, ...coordenadas };
  } catch (e) {
    console.error('Erro ao carregar coordenadas do servidor, usando fallback local se disponível:', e.message);
    const coordsEmbutidos = empresas.reduce((acc, e) => {
      if (e.coordenadas && Number.isFinite(e.coordenadas.lat) && Number.isFinite(e.coordenadas.lon)) {
        acc[e.endereco] = { lat: e.coordenadas.lat, lon: e.coordenadas.lon };
      }
      return acc;
    }, {});
    return coordsEmbutidos;
  }
}

async function criarMarcadoresComCoordenadasProgressivo(coordenadas, options = {}) {
  const shouldContinue = typeof options.shouldContinue === 'function' ? options.shouldContinue : () => true;
  const onProgress = typeof options.onProgress === 'function' ? options.onProgress : () => {};
  const chunkSize = Number.isFinite(options.chunkSize) ? Math.max(50, options.chunkSize) : 180;

  Object.keys(markers).forEach(idx => {
    if (markers[idx] && markers[idx].marker) markers[idx].marker.remove();
    delete markers[idx];
  });
  markerGroup.clearLayers();
  _clusterLayer.clearLayers();

  const cnpjsAdicionados = new Set();
  const processaveis = [];
  empresas.forEach((empresa, idx) => {
    if (cnpjsAdicionados.has(empresa.cnpj)) return;
    const coords = coordenadas[empresa.endereco];
    if (!coords) return;
    cnpjsAdicionados.add(empresa.cnpj);
    processaveis.push({ empresa, idx, coords });
  });

  const totalProcessamento = processaveis.length;
  let processadas = 0;
  onProgress({ processadas, totalProcessamento });

  for (let i = 0; i < processaveis.length; i += chunkSize) {
    if (!shouldContinue()) return;
    const bloco = processaveis.slice(i, i + chunkSize);
    bloco.forEach(({ empresa, idx, coords }) => {
      empresa.coordenadas = coords;
      let tel = empresa.telefone;
      if (empresa.whatsapp) tel = '<a href="' + empresa.whatsapp + '" target="_blank" style="color: #25D366;">WhatsApp: ' + empresa.telefone + '</a>';
      const cidadeNome = extrairCidadeDoEndereco(empresa.endereco) || '';
      const icon = liteMode ? criarIconeClassico(obterCorPorCapital(empresa.capital)) : criarIconePiramide();
      const marker = L.marker([coords.lat, coords.lon], { icon: icon })
        .bindPopup(`<div style="font-size:13px;width:250px;"><b>${empresa.nome}</b><br>CNPJ: ${empresa.cnpj}<br>Capital: <span style="color:${obterCorPorCapital(empresa.capital)};font-weight:bold;">R$ ${formatarCapital(empresa.capital)}</span><br>Endereco: ${formatarEnderecoComBairro(empresa)}<br>Telefone: ${tel}<br>Porte: ${empresa.porte}<br><br><a href="#" onclick="event.preventDefault(); mostrarPainelPlanification('${_codigoCidadeAtiva || ''}', '${cidadeNome.replace(/'/g, "\\'").replace(/"/g, '&quot;')}', '${empresa.cnpj}', '${empresa.nome.replace(/'/g, "\\'").replace(/"/g, '&quot;')}'); return false;" style="color: #2196F3; font-weight: bold; text-decoration: underline;">🔧 Planificar</a></div>`);
      marker.addTo(map);
      markerGroup.addLayer(marker);
      if (!liteMode) iniciarPiramideNoMarcador(marker, obterCorPorCapital(empresa.capital), empresa.capital);
      markers[idx] = { marker, empresa };
    });
    processadas += bloco.length;
    onProgress({ processadas, totalProcessamento });
    await new Promise(resolve => requestAnimationFrame(resolve));
  }

  if (markerGroup.getLayers().length > 0) {
    console.log(`✅ ${markerGroup.getLayers().length} marcadores adicionados ao mapa`);
  }
  _atualizarClusters();
}

  }

  const filtradas = empresas.filter(e => e.nome.toLowerCase().includes(filtro.toLowerCase()));
  filtradas.sort((a, b) => b.capital - a.capital);
  
  // Remover duplicatas mantendo apenas a primeira ocorrência de cada CNPJ
  const empresasUnicas = [];
  const cnpjVistos = new Set();
  filtradas.forEach(e => {
    if(!cnpjVistos.has(e.cnpj)) {
      empresasUnicas.push(e);
      cnpjVistos.add(e.cnpj);
    }
  });
  
  empresasUnicas.forEach((empresa) => {
    const div = document.createElement("div"); 
    div.className = "empresa-item";
    div.style.display = "flex";
    div.style.alignItems = "flex-start";
    
    // Criar checkbox
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "empresa-checkbox";
    checkbox.checked = empresasAtivasByCNPJ.has(empresa.cnpj);
    checkbox.addEventListener("change", () => {
      if(checkbox.checked) {
        empresasAtivasByCNPJ.add(empresa.cnpj);
      } else {
        empresasAtivasByCNPJ.delete(empresa.cnpj);
      }
      // Regenerar gráfico se aba Gráficos está ativa
      if(document.getElementById("graficos").classList.contains("active")) {
        renderizarGrafico();
      }
    });
    div.appendChild(checkbox);
    
    // Criar conteúdo
    const content = document.createElement("div");
    content.className = "empresa-item-content";
    let tel = empresa.telefone;
    if (empresa.whatsapp) tel = '<a href="' + empresa.whatsapp + '" target="_blank" style="color: #25D366;">WhatsApp</a>';
    content.innerHTML = `<b>${empresa.nome}</b><br><font size=2>CNPJ: ${empresa.cnpj}<br>Capital: <span style="color:${obterCorPorCapital(empresa.capital)};font-weight:bold;">R$ ${formatarCapital(empresa.capital)}</span><br>Endereco: ${formatarEnderecoComBairro(empresa)}<br>Telefone: ${tel}<br>Porte: ${empresa.porte}</font>`;
    div.appendChild(content);
    
    // Click no conteúdo para navegar no mapa
    content.addEventListener("click", () => { 
      const idx = empresas.findIndex(e => e.cnpj === empresa.cnpj); 
      if (markers[idx] && empresasAtivasByCNPJ.has(empresa.cnpj)) { 
        map.setView(markers[idx].marker.getLatLng(), 16); 
        markers[idx].marker.openPopup(); 
        document.querySelectorAll(".empresa-item").forEach(el => el.classList.remove("active")); 
        div.classList.add("active"); 
      } 
    });
    
    lista.appendChild(div);
  });
  if (empresasUnicas.length === 0) lista.innerHTML = '<div style="text-align:center;color:#999;">Nenhuma encontrada</div>';
}

function normalizarBuscaEmpresa(str = '') {
  return removerAcentos(String(str).toLowerCase().trim());
}

function obterNomesEmpresasUnicos() {
  const nomes = [...new Set(empresas.map(e => (e.nome || '').trim()).filter(Boolean))];
  return nomes.sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

function inicializarAutocompleteEmpresas() {
  const inputEmpresa = document.getElementById('searchInput');
  const autocompleteList = document.getElementById('empresaAutocomplete');
  const searchBox = inputEmpresa ? inputEmpresa.closest('.search-box') : null;
  let selecionadoIndex = -1;

  if (!inputEmpresa || !autocompleteList || !searchBox) return;

  searchBox.style.position = 'relative';

  const fecharAutocomplete = () => {
    autocompleteList.style.display = 'none';
    selecionadoIndex = -1;
  };

  const aplicarSelecaoEmpresa = (empresaSelecionada) => {
    inputEmpresa.value = empresaSelecionada;
    renderizarLista(empresaSelecionada);
    const primeiroResultado = document.querySelector('#listaEmpresas .empresa-item .empresa-item-content');
    if (primeiroResultado) primeiroResultado.click();
    fecharAutocomplete();
  };

  const renderizarAutocomplete = (valorDigitado) => {
    const nomesEmpresas = obterNomesEmpresasUnicos();
    const termo = normalizarBuscaEmpresa(valorDigitado);

    if (!termo) {
      fecharAutocomplete();
      return;
    }

    const nomesConselhos = (typeof _conselhosCidadeAtual !== 'undefined' && Array.isArray(_conselhosCidadeAtual))
      ? _conselhosCidadeAtual.filter(c => normalizarBuscaEmpresa(c.nome || '').includes(termo)).map(c => c.nome)
      : [];

    const filtradas = [
      ...nomesConselhos,
      ...nomesEmpresas.filter(nome => normalizarBuscaEmpresa(nome).includes(termo))
    ].slice(0, 10);

    if (!filtradas.length) {
      fecharAutocomplete();
      return;
    }

    autocompleteList.innerHTML = filtradas.map((nome, idx) =>
      `<div class="autocomplete-item" data-empresa="${nome.replace(/"/g, '&quot;')}" data-index="${idx}">${nome}</div>`
    ).join('');
    autocompleteList.style.display = 'block';
    selecionadoIndex = -1;

    autocompleteList.querySelectorAll('.autocomplete-item').forEach(item => {
      item.addEventListener('click', () => {
        const empresaSelecionada = item.getAttribute('data-empresa') || '';
        aplicarSelecaoEmpresa(empresaSelecionada);
      });
    });
  };

  inputEmpresa.addEventListener('input', (e) => {
    const valor = e.target.value;
    renderizarLista(valor);
    renderizarAutocomplete(valor);
  });

  inputEmpresa.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      inputEmpresa.value = '';
      fecharAutocomplete();
      renderizarLista('');
      return;
    }

    const items = autocompleteList.querySelectorAll('.autocomplete-item');
    const aberto = autocompleteList.style.display !== 'none';

    if (!items.length || !aberto) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selecionadoIndex = Math.min(selecionadoIndex + 1, items.length - 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selecionadoIndex = Math.max(selecionadoIndex - 1, 0);
    } else if (e.key === 'Enter' || e.key === ' ') {
      if (selecionadoIndex >= 0 && selecionadoIndex < items.length) {
        e.preventDefault();
        const empresaSelecionada = items[selecionadoIndex].getAttribute('data-empresa') || '';
        aplicarSelecaoEmpresa(empresaSelecionada);
      }
      return;
    } else {
      return;
    }

    items.forEach((item, i) => item.classList.toggle('selected', i === selecionadoIndex));
    if (items[selecionadoIndex]) items[selecionadoIndex].scrollIntoView({ block: 'nearest' });
  });

  inputEmpresa.addEventListener('focus', () => {
    if (inputEmpresa.value.trim()) renderizarAutocomplete(inputEmpresa.value);
  });

  document.addEventListener('click', (e) => {
    if (e.target !== inputEmpresa && !autocompleteList.contains(e.target)) {
      fecharAutocomplete();
    }
  });
}

inicializarAutocompleteEmpresas();

      }, 320);
    } else {
      sidebar.classList.remove("expanded");
    }
  });

  btn.addEventListener('keydown', (e) => {
    const abas = Array.from(document.querySelectorAll('.tab-button'));
    const indiceAtual = abas.indexOf(btn);
    if (indiceAtual < 0) return;

    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      const proximoIndice = (indiceAtual + dir + abas.length) % abas.length;
      abas[proximoIndice].focus();
      return;
    }

    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      btn.click();
    }
  });
});

// GRÁFICO PIE COM APACHE ECHARTS
let echartsInstance = null;
let dadosPieLegendaGraficoAtual = [];
let buscaLegendaGraficoInicializada = false;
let legendaGraficoAberta = false;
let escBuscaGraficoArmadoParaFechar = false;

function obterNomeLegendaPorIndice(indice) {
  if (!Number.isInteger(indice) || indice < 0) return '';
  const item = dadosPieLegendaGraficoAtual[indice];
  return item ? (item.name || '') : '';
}

function atualizarEstadoVisualLegendaNavegavel() {
  const container = document.getElementById('chartLegendKeyboard');
  if (!container || !echartsInstance) return;

  const option = echartsInstance.getOption();
  const legendCfg = option && option.legend && option.legend[0] ? option.legend[0] : null;
  const selected = legendCfg && legendCfg.selected ? legendCfg.selected : {};

  const botoes = container.querySelectorAll('button[data-legend-index]');
  botoes.forEach(btn => {
    const indice = Number(btn.getAttribute('data-legend-index'));
    const nome = obterNomeLegendaPorIndice(indice);
    const ativo = selected[nome] !== false;

    btn.style.background = ativo ? '#f5f5f5' : '#e6e6e6';
    btn.style.color = ativo ? '#333' : '#8a8a8a';
    btn.style.borderColor = ativo ? '#ccc' : '#bdbdbd';
    btn.style.textDecoration = ativo ? 'none' : 'line-through';
    btn.setAttribute('aria-pressed', ativo ? 'true' : 'false');
  });
}

function abrirLegendaGrafico({ mostrarTudo = false, focarPrimeiro = false } = {}) {
  legendaGraficoAberta = true;
  atualizarLegendaNavegavel(dadosPieLegendaGraficoAtual, mostrarTudo ? '' : null);

  if (focarPrimeiro) {
    const primeiro = document.querySelector('#chartLegendKeyboard button[data-legend-name]');
    if (primeiro) primeiro.focus();
  }
}

function retornarParaBuscaGrafico() {
  const inputBusca = document.getElementById('searchGraficoEmpresas');
  if (!inputBusca) return;

  inputBusca.scrollIntoView({ behavior: 'smooth', block: 'center' });
  inputBusca.focus({ preventScroll: true });
  const fim = inputBusca.value.length;
  inputBusca.setSelectionRange(0, fim);
  escBuscaGraficoArmadoParaFechar = true;
  abrirLegendaGrafico();
}

function fecharLegendaGrafico() {
  legendaGraficoAberta = false;
  escBuscaGraficoArmadoParaFechar = false;
  const container = document.getElementById('chartLegendKeyboard');
  if (container) container.style.display = 'none';
}

function escaparHtml(str = '') {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function atualizarLegendaNavegavel(dadosPie = [], termoForcado = null) {
  const container = document.getElementById('chartLegendKeyboard');
  const inputBusca = document.getElementById('searchGraficoEmpresas');
  if (!container) return;

  if (!legendaGraficoAberta) {
    container.style.display = 'none';
    return;
  }

  const termoBusca = termoForcado !== null
    ? normalizarBuscaEmpresa(termoForcado)
    : (inputBusca ? normalizarBuscaEmpresa(inputBusca.value) : '');
  const dadosFiltrados = termoBusca
    ? dadosPie.filter(item => normalizarBuscaEmpresa(item.name || '').includes(termoBusca))
    : dadosPie;

  if (!dadosFiltrados.length) {
    container.style.display = 'block';
    container.innerHTML = '<div style="font-size:12px;color:#999;">Nenhuma empresa encontrada na legenda.</div>';
    return;
  }

  container.style.display = 'block';
  container.innerHTML = dadosFiltrados.map((item, idx) => {
    const nomeSeguro = escaparHtml(item.name);
    const cnpjSeguro = escaparHtml(item.cnpj || '');
    const indiceOriginal = dadosPie.findIndex(d => d.cnpj === item.cnpj && d.name === item.name);
    return `<button type="button" data-legend-name="${nomeSeguro}" data-legend-cnpj="${cnpjSeguro}" data-legend-index="${indiceOriginal}" style="display:block;width:100%;text-align:left;padding:6px 8px;margin-bottom:4px;background:#f5f5f5;color:#333;border:1px solid #ccc;border-radius:4px;cursor:pointer;font-size:12px;">${nomeSeguro}</button>`;
  }).join('');

  const botoes = Array.from(container.querySelectorAll('button[data-legend-name]'));

  botoes.forEach((btn, idx) => {
    btn.addEventListener('click', () => {
      const cnpj = btn.getAttribute('data-legend-cnpj') || '';
      const indice = Number(btn.getAttribute('data-legend-index'));
      apresentarEmpresaNoGraficoPorIndice(Number.isFinite(indice) ? indice : -1);
      navegarParaEmpresaNoMapaPorCnpj(cnpj);
    });

    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        retornarParaBuscaGrafico();
        return;
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        const cnpj = btn.getAttribute('data-legend-cnpj') || '';
        const indice = Number(btn.getAttribute('data-legend-index'));
        apresentarEmpresaNoGraficoPorIndice(Number.isFinite(indice) ? indice : -1);
        navegarParaEmpresaNoMapaPorCnpj(cnpj);
        return;
      }

      if (e.key === ' ') {
        e.preventDefault();
        if (!echartsInstance) return;
        const indice = Number(btn.getAttribute('data-legend-index'));
        const nome = obterNomeLegendaPorIndice(Number.isFinite(indice) ? indice : -1);
        if (!nome) return;
        echartsInstance.dispatchAction({ type: 'legendToggleSelect', name: nome });
        atualizarEstadoVisualLegendaNavegavel();
        return;
      }

      const isArrow = e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowLeft';
      if (!isArrow) return;

      e.preventDefault();
      const dir = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : -1;
      const prox = (idx + dir + botoes.length) % botoes.length;
      botoes[prox].focus();
    });
  });

  atualizarEstadoVisualLegendaNavegavel();
}

function inicializarBuscaLegendaGrafico() {
  if (buscaLegendaGraficoInicializada) return;
  const inputBusca = document.getElementById('searchGraficoEmpresas');
  const container = document.getElementById('chartLegendKeyboard');
  if (!inputBusca) return;

  buscaLegendaGraficoInicializada = true;
  inputBusca.addEventListener('input', () => {
    escBuscaGraficoArmadoParaFechar = false;
    abrirLegendaGrafico();
  });

  inputBusca.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === ' ') {
      e.preventDefault();
      escBuscaGraficoArmadoParaFechar = false;
      abrirLegendaGrafico({ mostrarTudo: true, focarPrimeiro: true });
      return;
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      escBuscaGraficoArmadoParaFechar = false;
      abrirLegendaGrafico({ mostrarTudo: true, focarPrimeiro: true });
      return;
    }

    if (e.key === 'Escape') {
      e.preventDefault();
      if (escBuscaGraficoArmadoParaFechar && document.activeElement === inputBusca) {
        inputBusca.value = '';
        fecharLegendaGrafico();
        return;
      }
      retornarParaBuscaGrafico();
    }
  });

  inputBusca.addEventListener('focus', () => {
    if (inputBusca.value.trim()) abrirLegendaGrafico();
  });

  document.addEventListener('click', (e) => {
    if (!container) return;
    if (e.target === inputBusca || container.contains(e.target)) return;
    fecharLegendaGrafico();
  });
}

function navegarParaEmpresaNoMapaPorCnpj(cnpj) {
  const marcador = Object.values(markers).find(m => m.empresa.cnpj === cnpj);
  if (marcador) {
    map.setView(marcador.marker.getLatLng(), 16, { animate: false });

    const sidebar = document.querySelector('.sidebar');
    const larguraSidebar = sidebar ? Math.round(sidebar.getBoundingClientRect().width) : 0;
    const larguraMapa = map.getSize().x;
    const larguraUtil = Math.max(120, larguraMapa - larguraSidebar);

    const pontoEmpresa = map.latLngToContainerPoint(marcador.marker.getLatLng());
    const alvoX = Math.max(40, Math.min(larguraUtil - 40, larguraUtil * 0.5));
    const deslocamentoX = pontoEmpresa.x - alvoX;

    if (Math.abs(deslocamentoX) > 2) {
      map.once('moveend', () => marcador.marker.openPopup());
      map.panBy([deslocamentoX, 0], { animate: true, duration: 0.35 });
    } else {
      marcador.marker.openPopup();
    }
  }
}

function apresentarEmpresaNoGraficoPorIndice(dataIndex) {
  if (!echartsInstance) return;
  if (!Number.isInteger(dataIndex) || dataIndex < 0) return;

  echartsInstance.dispatchAction({ type: 'downplay', seriesIndex: 0 });
  echartsInstance.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex });
  echartsInstance.dispatchAction({ type: 'showTip', seriesIndex: 0, dataIndex });

  const chartContainer = document.getElementById('chartContainer');
  if (chartContainer) {
    chartContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function renderizarGrafico() {
  const uniqueEmpesas = [...new Map(empresas.map(e => [e.cnpj, e])).values()];
  // Filtrar apenas empresas ativas (não desmarcadas)
  const uniqueEmpresasAtivas = uniqueEmpesas.filter(e => empresasAtivasByCNPJ.has(e.cnpj));
  const dadosOrdenados = uniqueEmpresasAtivas.sort((a, b) => b.capital - a.capital);
  
  // Preparar dados para ECharts
  const dadosPie = dadosOrdenados.map(e => ({
    value: e.capital,
    name: e.nome,
    itemStyle: { color: e.cor },
    cnpj: e.cnpj
  }));
  
  // Calcular total para percentuais
  const total = dadosPie.reduce((sum, item) => sum + item.value, 0);
  
  // Inicializar ECharts se necessário
  const chartDOM = document.getElementById('chartContainer');
  if(!echartsInstance) {
    echartsInstance = echarts.init(chartDOM, null, { renderer: 'canvas' });
    window.addEventListener('resize', () => {
      if(echartsInstance) echartsInstance.resize();
    });
  }
  
  // Configurar opções do gráfico
  const opcoes = {
    tooltip: {
      trigger: 'item',
      formatter: function(params) {
        if(params.componentSubType === 'pie') {
          const percentual = ((params.value / total) * 100).toFixed(2);
          return `<strong>${params.name}</strong><br/>Capital: R$ ${formatarCapital(params.value)}<br/>Percentual: ${percentual}%`;
        }
      },
      backgroundColor: 'rgba(0,0,0,0.8)',
      borderColor: '#ccc',
      textStyle: { color: '#fff' }
    },
    legend: {
      type: 'scroll',
      orient: 'horizontal',
      left: 'center',
      bottom: 10,
      data: dadosPie.map(d => d.name),
      textStyle: { fontSize: 11, color: document.body.classList.contains('dark-mode') ? '#0FFF50' : '#333' },
      pageTextStyle: { color: document.body.classList.contains('dark-mode') ? '#0FFF50' : '#2196F3' }
    },
    series: [
      {
        name: 'Capital Social',
        type: 'pie',
        radius: ['0%', '75%'],
        avoidLabelOverlap: false,
        data: dadosPie,
        label: {
          show: false,
          position: 'center'
        },
        emphasis: {
          label: {
            show: true,
            fontSize: 20,
            fontWeight: 'bold'
          },
          itemStyle: {
            shadowBlur: 10,
            shadowOffsetX: 0,
            shadowColor: 'rgba(0, 0, 0, 0.5)'
          }
        }
      }
    ],
    graphic: {
      elements: [
        {
          type: 'text',
          left: 'center',
          top: 'center',
          style: {
            text: dadosOrdenados.length + ' Empresas',
            fontSize: 18,
            fontWeight: 'bold',
            fill: '#333'
          }
        }
      ]
    }
  };

  dadosPieLegendaGraficoAtual = dadosPie;
  inicializarBuscaLegendaGrafico();
  if (legendaGraficoAberta) {
    atualizarLegendaNavegavel(dadosPieLegendaGraficoAtual);
  }
  
  echartsInstance.setOption(opcoes);
  
  // Clique no gráfico para navegar
  echartsInstance.off('click');
  echartsInstance.on('click', function(params) {
    if(params.componentSubType === 'pie') {
      const cnpj = params.data.cnpj;
      navegarParaEmpresaNoMapaPorCnpj(cnpj);
    }
  });

  echartsInstance.off('legendselectchanged');
  echartsInstance.on('legendselectchanged', () => {
    atualizarEstadoVisualLegendaNavegavel();
  });
}

<script>
// ─── Conselhos Populares no mapa ─────────────────────────────────────────────
const conselhosLayer = L.featureGroup().addTo(map);
const conselhosGlobaisLayer = L.featureGroup().addTo(map);
const _conselhosCarregados = {};
let _conselhosCidadeAtual = [];
let _conselhosGlobaisCarregados = false;

/**
 * Carrega conselhos globais (estaduais, nacionais, continentais, internacionais)
 * que devem aparecer no mapa independentemente de qual cidade está selecionada.
 */
async function carregarConselhosGlobais() {
  if (_conselhosGlobaisCarregados) return;
  _conselhosGlobaisCarregados = true;
  try {
    const resp = await fetch('/api/conselhos-globais');
    if (!resp.ok) return;
    const conselhos = await resp.json();
    if (!Array.isArray(conselhos) || !conselhos.length) return;

    conselhos.forEach(conselho => {
      const lat = Number(conselho.latitude);
      const lon = Number(conselho.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

      // Determinar o nível do conselho para o rótulo
      let nivel = 'Conselho Popular';
      if (conselho.estado && !conselho.codigoCidade) nivel = 'Conselho Estadual';
      if (conselho.pais && !conselho.estado) nivel = 'Conselho Nacional';
      if (conselho.continente && !conselho.pais) nivel = 'Conselho Continental';
      if (conselho.id === 1) nivel = 'Conselho Internacional';

      const icon = liteMode ? criarIconeClassico('#FFD54F') : criarIconePiramide();
      const _cNome = (conselho.nome || 'Conselho Popular').replace(/'/g, "\\'").replace(/"/g, '&quot;');
      const marker = L.marker([lat, lon], { icon: icon, zIndexOffset: 2000 })
        .bindPopup(`<div style="font-size:13px;width:280px;">
          <b style="color:#FFD54F;font-size:14px;">🏛️ ${conselho.nome || 'Conselho Popular'}</b><br>
          <span style="color:#aaa">${nivel}</span><br><br>
          <a href="#" onclick="event.preventDefault(); mostrarPainelPlanificationConselho('${conselho.id}', '${_cNome}'); return false;" style="color: #FFD54F; font-weight: bold; text-decoration: underline;">🔧 Planificar</a>
        </div>`);

      conselhosGlobaisLayer.addLayer(marker);
      if (!liteMode) iniciarPiramideNoMarcador(marker, '#FFD54F', 0);
    });
  } catch (e) {
    console.warn('Erro ao carregar conselhos globais:', e);
    _conselhosGlobaisCarregados = false;
  }
}

async function carregarConselhosMapa(nomeCidade) {
  if (!nomeCidade) return;
  const cidade = nomeCidade.toUpperCase().trim();
  if (_conselhosCarregados[cidade]) return;
  _conselhosCarregados[cidade] = true;

  try {
    const resp = await fetch(`/api/conselhos-cidade?nome=${encodeURIComponent(cidade)}`);
    if (!resp.ok) return;
    const conselhos = await resp.json();
    if (!Array.isArray(conselhos) || !conselhos.length) {
      conselhosLayer.clearLayers();
      _conselhosCidadeAtual = [];
      return;
    }

    conselhosLayer.clearLayers();
    _conselhosCidadeAtual = conselhos;

    conselhos.forEach(conselho => {
      let lat = conselho.latitude != null ? Number(conselho.latitude) : null;
      let lon = conselho.longitude != null ? Number(conselho.longitude) : null;
      let coordComputada = false;

      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        const comCoords = empresas.filter(e => e.coordenadas && Number.isFinite(e.coordenadas.lat) && Number.isFinite(e.coordenadas.lon));
        if (!comCoords.length) return;
        const centroLat = comCoords.reduce((s, e) => s + e.coordenadas.lat, 0) / comCoords.length;
        const centroLon = comCoords.reduce((s, e) => s + e.coordenadas.lon, 0) / comCoords.length;
        lat = centroLat + 0.003;
        lon = centroLon + 0.003;
        coordComputada = true;

        fetch(`/api/conselhos-cidade/${conselho.id}/coordenadas`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitude: lat, longitude: lon })
        }).catch(() => {});
      }

      const icon = liteMode ? criarIconeClassico('#4FC3F7') : criarIconePiramide();
      const aviso = coordComputada
        ? '<br><em style="color:#aaa;font-size:11px;">📍 Localização estimada — será corrigida</em>'
        : '';

      const _cNome = (conselho.nome || 'Conselho Popular').replace(/'/g, "\\'").replace(/"/g, '&quot;');
      const marker = L.marker([lat, lon], { icon: icon, zIndexOffset: 1000 })
        .bindPopup(`<div style="font-size:13px;width:260px;">
          <b style="color:#4FC3F7;font-size:14px;">🏛️ ${conselho.nome || 'Conselho Popular'}</b><br>
          <span style="color:#aaa">Conselho Popular · ${conselho.cidade || cidade}</span>${aviso}<br><br>
          <a href="#" onclick="event.preventDefault(); mostrarPainelPlanificationConselho('${conselho.id}', '${_cNome}'); return false;" style="color: #2196F3; font-weight: bold; text-decoration: underline;">🔧 Planificar</a>
        </div>`);

      conselhosLayer.addLayer(marker);
      if (!liteMode) iniciarPiramideNoMarcador(marker, '#4FC3F7', 0);
    });

    // Atualizar lista lateral para exibir o conselho
    const inputEmpresa = document.getElementById('searchInput');
    renderizarLista(inputEmpresa ? inputEmpresa.value : '');

  } catch (e) {
    console.warn('Erro ao carregar conselhos no mapa:', e);
  }
}

// Carregar conselhos para a cidade inicial (quando a página já tem uma cidade ao carregar)
window.addEventListener('DOMContentLoaded', function() {
  // Carregar conselhos globais (sempre visíveis no mapa)
  carregarConselhosGlobais();

  // _cidadeAtivaMapa só estará preenchida se a cidade foi carregada antes do DOMContentLoaded
  // (raro). O fluxo normal é via carregarCidadeNoMapa → carregarConselhosMapa acima.
  setTimeout(function() {
    const cidadeInicial = _cidadeAtivaMapa;
    if (cidadeInicial && !_conselhosCarregados[cidadeInicial]) {
      carregarConselhosMapa(cidadeInicial);
    }
  }, 500);
});
// ─────────────────────────────────────────────────────────────────────────────
</script>
