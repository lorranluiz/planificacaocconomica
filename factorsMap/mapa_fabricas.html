<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Fábricas</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

  <style>
    /* ==================== SISTEMA DE ESQUEMA DE CORES ==================== */
    /* Tema Azul (Padrão) */
    :root,
    [data-color-scheme="blue"] {
      --scheme-bg-main: #1e1e1e;
      --scheme-bg-card: #2d2d2d;
      --scheme-bg-modal: #12121f;
      --scheme-bg-modal-backdrop: rgba(0,0,0,0.82);
      --scheme-bg-hover: #333;
      --scheme-primary: #2196F3;
      --scheme-primary-light: #4fc3f7;
      --scheme-border-main: rgba(33,150,243,0.35);
      --scheme-text-primary: #e0e0e0;
    }
    
    /* Tema Vermelho */
    [data-color-scheme="red"] {
      --scheme-bg-main: #121212;
      --scheme-bg-card: #212121;
      --scheme-bg-modal: #101010;
      --scheme-bg-modal-backdrop: rgba(0,0,0,0.85);
      --scheme-bg-hover: #2d2d2d;
      --scheme-primary: #c62828;
      --scheme-primary-light: #ff5f52;
      --scheme-border-main: rgba(198,40,40,0.35);
      --scheme-text-primary: #f5f5f5;
    }
    /* ==================== FIM ESQUEMA DE CORES ==================== */
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Verdana, Geneva, sans-serif; background: #f5f5f5; color: #333; transition: background-color 0.3s ease, color 0.3s ease; }
    body.dark-mode { background: #1e1e1e; color: #e0e0e0; }
    .container { display: flex; height: 100vh; }
    #map { flex: 1; height: 100%; position: relative; }
    .sidebar { width: 350px; background: white; box-shadow: -2px 0 8px rgba(0,0,0,0.1); overflow-y: auto; padding: 0; display: flex; flex-direction: column; transition: width 0.3s ease, background-color 0.3s ease; }
    .sidebar.expanded { width: 750px; }
    body.dark-mode .sidebar { background: #2d2d2d; box-shadow: -2px 0 8px rgba(0,0,0,0.5); }
    .header-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #ddd; background: #fafafa; }
    body.dark-mode .header-top { border-bottom-color: #0FFF50; background: #1a1a1a; border-bottom: 2px solid rgba(15, 255, 80, 0.5); box-shadow: 0 2px 10px rgba(15, 255, 80, 0.2); }
    .dark-mode-toggle { background: none; border: none; cursor: pointer; font-size: 20px; padding: 5px 10px; border-radius: 4px; transition: all 0.3s; }
    .dark-mode-toggle:hover { background: rgba(33,150,243,0.2); }
    body.dark-mode .dark-mode-toggle:hover { background: rgba(15,255,80,0.2); }
    .color-scheme-toggle { background: none; border: none; cursor: pointer; font-size: 18px; padding: 5px 10px; border-radius: 4px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
    .color-scheme-toggle:hover { background: rgba(33,150,243,0.2); }
    body.dark-mode .color-scheme-toggle:hover { background: rgba(15,255,80,0.2); }
    [data-color-scheme="blue"] .color-scheme-toggle { color: #2196F3; }
    [data-color-scheme="red"] .color-scheme-toggle { color: #c62828; }
    body.dark-mode[data-color-scheme="blue"] .color-scheme-toggle { color: #4fc3f7; }
    body.dark-mode[data-color-scheme="red"] .color-scheme-toggle { color: #ff5f52; }
    .tabs { display: flex; border-bottom: 2px solid #ddd; background: #fafafa; }
    body.dark-mode .tabs { border-bottom-color: rgba(15, 255, 80, 0.3); background: #1a1a1a; }
    .tab-button { flex: 1; padding: 15px; text-align: center; cursor: pointer; border: none; background: none; font-size: 13px; font-weight: bold; color: #666; transition: all 0.3s; border-bottom: 3px solid transparent; }
    body.dark-mode .tab-button { color: #aaa; }
    .tab-button:hover { background: #f0f0f0; }
    body.dark-mode .tab-button:hover { background: #333; }
    .tab-button.active { color: #2196F3; border-bottom-color: #2196F3; background: white; }
    body.dark-mode .tab-button.active { color: #0FFF50; border-bottom-color: #0FFF50; background: #2d2d2d; }
    .tab-content { flex: 1; overflow-y: auto; padding: 25px; display: none; }
    .tab-content.active { display: block; }
    .sidebar h2 { color: #333; margin-bottom: 15px; font-size: 18px; border-bottom: 3px solid #2196F3; padding-bottom: 10px; }
    body.dark-mode .sidebar h2 { color: #e0e0e0; }
    .stats { background: #f0f7ff; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; color: #1976d2; }
    body.dark-mode .stats { background: rgba(15,255,80,0.1); color: #0FFF50; border: 1px solid rgba(15,255,80,0.3); }
    .legenda { background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 15px; }
    body.dark-mode .legenda { background: #2d2d2d; border-color: #444; }
    .legenda-titulo { font-weight: bold; margin-bottom: 8px; font-size: 12px; color: #333; }
    body.dark-mode .legenda-titulo { color: #e0e0e0; }
    .legenda-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 11px; color: #333; }
    body.dark-mode .legenda-item { color: #aaa; }
    .legenda-cor { width: 18px; height: 18px; border-radius: 2px; margin-right: 8px; }
    .search-box { margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 4px; font-size: 14px; background: white; color: #333; }
    body.dark-mode .search-box input { background: #3d3d3d; border-color: #555; color: #e0e0e0; }
    .search-box input:focus { outline: none; border-color: #2196F3; }
    body.dark-mode .search-box input:focus { border-color: #0FFF50; box-shadow: 0 0 8px rgba(15,255,80,0.5); }
    .lite-mode-toggle { background: none; border: none; cursor: pointer; padding: 5px 10px; border-radius: 4px; transition: all 0.3s; color: #333; display: flex; align-items: center; }
    .lite-mode-toggle:hover { background: rgba(33,150,243,0.2); }
    body.dark-mode .lite-mode-toggle { color: #aaa; }
    body.dark-mode .lite-mode-toggle:hover { background: rgba(15,255,80,0.2); }
    .lite-mode-toggle.active { color: #2196F3; background: rgba(33,150,243,0.15); }
    body.dark-mode .lite-mode-toggle.active { color: #0FFF50; background: rgba(15,255,80,0.15); }
    /* Autocomplete dropdown */
    .autocomplete-list { position: absolute; background: white; border: 1px solid #ddd; border-top: none; border-radius: 0 0 4px 4px; max-height: 200px; overflow-y: auto; width: 100%; z-index: 1000; }
    body.dark-mode .autocomplete-list { background: #3d3d3d; border-color: #555; }
    .autocomplete-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
    body.dark-mode .autocomplete-item { border-bottom-color: #555; color: #e0e0e0; }
    .autocomplete-item:hover { background: #f0f0f0; }
    body.dark-mode .autocomplete-item:hover { background: #4d4d4d; }
    .autocomplete-item.selected { background: #2196F3; color: white; }
    body.dark-mode .autocomplete-item.selected { background: #0FFF50; color: #000; }
    .empresa-item { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.3s; color: #333; }
    body.dark-mode .empresa-item { background: #2d2d2d; border-color: #444; color: #e0e0e0; }
    .empresa-item:hover { box-shadow: 0 2px 8px rgba(33,150,243,0.3); border-color: #2196F3; }
    body.dark-mode .empresa-item:hover { box-shadow: 0 2px 8px rgba(15,255,80,0.4); border-color: #0FFF50; }
    .empresa-item.active { background: #e3f2fd; border-color: #2196F3; }
    body.dark-mode .empresa-item.active { background: rgba(15,255,80,0.1); border-color: #0FFF50; }
    #chartContainer { width: 100%; height: 800px; }
    body.dark-mode #chartContainer { filter: invert(0.9) hue-rotate(120deg); }
    .empresa-checkbox { width: 18px; height: 18px; margin-right: 10px; cursor: pointer; vertical-align: top; flex-shrink: 0; }
    .empresa-item-content { display: inline-block; vertical-align: top; width: calc(100% - 48px); word-wrap: break-word; }
    body.dark-mode[data-color-scheme="red"] .sidebar { background: #212121; }
    body.dark-mode[data-color-scheme="red"] .header-top { background: #1a1a1a; border-bottom: 2px solid rgba(198, 40, 40, 0.5); box-shadow: 0 2px 10px rgba(198, 40, 40, 0.2); }
    body.dark-mode[data-color-scheme="red"] .tabs { border-bottom-color: rgba(198, 40, 40, 0.3); background: #1a1a1a; }
    body.dark-mode[data-color-scheme="red"] .tab-button.active { color: #ff5f52; border-bottom-color: #ff5f52; background: #212121; }
    body.dark-mode[data-color-scheme="red"] .sidebar h2 { border-bottom-color: #c62828; }
    body.dark-mode[data-color-scheme="red"] .stats { background: rgba(198,40,40,0.1); color: #ff5f52; border: 1px solid rgba(198,40,40,0.3); }
    body.dark-mode[data-color-scheme="red"] .search-box input:focus { border-color: #c62828; box-shadow: 0 0 8px rgba(198,40,40,0.5); }
    body.dark-mode[data-color-scheme="red"] .autocomplete-item.selected { background: #c62828; color: #fff; }
    body.dark-mode[data-color-scheme="red"] .empresa-item:hover { box-shadow: 0 0 12px rgba(198,40,40,0.6) !important; }
    body.dark-mode[data-color-scheme="red"] .empresa-item.active { background: rgba(198,40,40,0.1); border-color: #c62828 !important; }
    body.dark-mode[data-color-scheme="red"] .dark-mode-toggle:hover { background: rgba(198,40,40,0.2); }
    body.dark-mode[data-color-scheme="red"] .lite-mode-toggle:hover { background: rgba(198,40,40,0.2); }
    body.dark-mode[data-color-scheme="red"] .lite-mode-toggle.active { color: #ff5f52; background: rgba(198,40,40,0.15); }
    
    /* Modo claro com esquema vermelho */
    body[data-color-scheme="red"]:not(.dark-mode) .tab-button.active { color: #c62828; border-bottom-color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .sidebar h2 { border-bottom-color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .stats { background: rgba(198,40,40,0.08); color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .search-box input:focus { border-color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .autocomplete-item.selected { background: #c62828; color: white; }
    body[data-color-scheme="red"]:not(.dark-mode) .empresa-item:hover { box-shadow: 0 2px 8px rgba(198,40,40,0.3); border-color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .empresa-item.active { background: rgba(198,40,40,0.05); border-color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .header-top span { color: #c62828; }
    
    /* Tema Retrofuturista Neon */
    body.dark-mode .sidebar h2 { 
      color: #0FFF50; 
      border-bottom-color: #0FFF50;
      text-shadow: 0 0 10px rgba(15, 255, 80, 0.5);
    }
    body.dark-mode .legenda-titulo { color: #0FFF50; text-shadow: 0 0 8px rgba(15, 255, 80, 0.4); }
    body.dark-mode .empresa-item { 
      border-color: rgba(15, 255, 80, 0.3);
      transition: all 0.3s ease;
    }
    body.dark-mode .empresa-item:hover { 
      border-color: #0FFF50;
      box-shadow: 0 0 12px rgba(15, 255, 80, 0.6);
    }
    body.dark-mode .empresa-item a { 
      color: #0FFF50; 
    }
    body.dark-mode .empresa-item a:hover { 
      text-shadow: 0 0 8px rgba(15, 255, 80, 0.7);
    }
    body.dark-mode .header-top span {
      color: #0FFF50;
      text-shadow: 0 0 8px rgba(15, 255, 80, 0.4);
      font-weight: bold;
    }
    /* Popup Retrofuturista Neon */
    .leaflet-popup-content-wrapper {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 6px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.2);
    }
    body.dark-mode .leaflet-popup-content-wrapper {
      background: rgba(15, 40, 25, 0.7);
      border: 2px solid rgba(15, 255, 80, 0.8);
      box-shadow: 0 0 20px rgba(15, 255, 80, 0.5), inset 0 0 10px rgba(15, 255, 80, 0.2);
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    body.dark-mode .leaflet-popup-content-wrapper a {
      color: #0FFF50;
    }
    body.dark-mode .leaflet-popup-content {
      color: #0FFF50;
      text-shadow: 0 0 5px rgba(15, 255, 80, 0.3);
    }
    body.dark-mode .leaflet-popup-content b {
      color: #0FFF50;
      text-shadow: 0 0 8px rgba(15, 255, 80, 0.5);
    }
    .leaflet-popup-tip {
      background: white;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
    }
    body.dark-mode .leaflet-popup-tip {
      background: rgba(15, 40, 25, 0.7);
      border-left-color: rgba(15, 255, 80, 0.6);
      border-right-color: rgba(15, 255, 80, 0.6);
      filter: drop-shadow(0 0 8px rgba(15, 255, 80, 0.4));
    }

    /* ==================== ESQUEMA DE CORES VERMELHO ==================== */
    /* Aplica cores vermelhas quando data-color-scheme="red", mantendo verde neon sempre */
    
    body.dark-mode[data-color-scheme="red"] .sidebar { background: #212121; }
    body.dark-mode[data-color-scheme="red"] .header-top { background: #1a1a1a; border-bottom: 2px solid rgba(198, 40, 40, 0.5); box-shadow: 0 2px 10px rgba(198, 40, 40, 0.2); }
    body.dark-mode[data-color-scheme="red"] .tabs { border-bottom-color: rgba(198, 40, 40, 0.3); background: #1a1a1a; }
    body.dark-mode[data-color-scheme="red"] .tab-button.active { color: #ff5f52; border-bottom-color: #ff5f52; background: #212121; }
    body.dark-mode[data-color-scheme="red"] .stats { background: rgba(198,40,40,0.1); color: #ff5f52; border: 1px solid rgba(198,40,40,0.3); }
    body.dark-mode[data-color-scheme="red"] .search-box input:focus { border-color: #c62828; box-shadow: 0 0 8px rgba(198,40,40,0.5); }
    body.dark-mode[data-color-scheme="red"] .autocomplete-item.selected { background: #c62828; color: #fff; }
    body.dark-mode[data-color-scheme="red"] .empresa-item:hover { box-shadow: 0 2px 8px rgba(198,40,40,0.4); border-color: #c62828; }
    body.dark-mode[data-color-scheme="red"] .empresa-item.active { background: rgba(198,40,40,0.1); border-color: #c62828; }
    body.dark-mode[data-color-scheme="red"] .dark-mode-toggle:hover { background: rgba(198,40,40,0.2); }
    body.dark-mode[data-color-scheme="red"] .color-scheme-toggle:hover { background: rgba(198,40,40,0.2); }
    body.dark-mode[data-color-scheme="red"] .lite-mode-toggle:hover { background: rgba(198,40,40,0.2); }
    body.dark-mode[data-color-scheme="red"] .lite-mode-toggle.active { color: #ff5f52; background: rgba(198,40,40,0.15); }
    
    /* Modo claro com esquema vermelho */
    body[data-color-scheme="red"]:not(.dark-mode) .tab-button.active { color: #c62828; border-bottom-color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .stats { background: rgba(198,40,40,0.08); color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .search-box input:focus { border-color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .autocomplete-item.selected { background: #c62828; color: white; }
    body[data-color-scheme="red"]:not(.dark-mode) .empresa-item:hover { box-shadow: 0 2px 8px rgba(198,40,40,0.3); border-color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .empresa-item.active { background: rgba(198,40,40,0.05); border-color: #c62828; }
    body[data-color-scheme="red"]:not(.dark-mode) .header-top span { color: #c62828; }
    
    /* ==================== FIM ESQUEMA VERMELHO ==================== */
    
    /* ==================== PRESERVAÇÃO DO VERDE NEON (sempre mantido) ==================== */
    /* Estes elementos mantêm o verde neon INDEPENDENTE do esquema de cores */
    body.dark-mode .sidebar h2,
    body.dark-mode[data-color-scheme="red"] .sidebar h2 { 
      color: #0FFF50 !important; 
      border-bottom-color: #0FFF50 !important;
      text-shadow: 0 0 10px rgba(15, 255, 80, 0.5) !important;
    }
    
    body.dark-mode .legenda-titulo,
    body.dark-mode[data-color-scheme="red"] .legenda-titulo { 
      color: #0FFF50 !important; 
      text-shadow: 0 0 8px rgba(15, 255, 80, 0.4) !important; 
    }
    
    body.dark-mode .empresa-item,
    body.dark-mode[data-color-scheme="red"] .empresa-item { 
      border-color: rgba(15, 255, 80, 0.3) !important;
    }
    
    body.dark-mode .empresa-item:hover,
    body.dark-mode[data-color-scheme="red"] .empresa-item:hover { 
      border-color: #0FFF50 !important;
      box-shadow: 0 0 12px rgba(15, 255, 80, 0.6) !important;
    }
    
    body.dark-mode .empresa-item a,
    body.dark-mode[data-color-scheme="red"] .empresa-item a { 
      color: #0FFF50 !important; 
    }
    
    body.dark-mode .empresa-item a:hover,
    body.dark-mode[data-color-scheme="red"] .empresa-item a:hover { 
      text-shadow: 0 0 8px rgba(15, 255, 80, 0.7) !important;
    }
    
    body.dark-mode .header-top span,
    body.dark-mode[data-color-scheme="red"] .header-top span {
      color: #0FFF50 !important;
      text-shadow: 0 0 8px rgba(15, 255, 80, 0.4) !important;
    }
    
    body.dark-mode .leaflet-popup-content-wrapper,
    body.dark-mode[data-color-scheme="red"] .leaflet-popup-content-wrapper {
      background: rgba(15, 40, 25, 0.7) !important;
      border: 2px solid rgba(15, 255, 80, 0.8) !important;
      box-shadow: 0 0 20px rgba(15, 255, 80, 0.5), inset 0 0 10px rgba(15, 255, 80, 0.2) !important;
    }
    
    body.dark-mode .leaflet-popup-content-wrapper a,
    body.dark-mode[data-color-scheme="red"] .leaflet-popup-content-wrapper a {
      color: #0FFF50 !important;
    }
    
    body.dark-mode .leaflet-popup-tip,
    body.dark-mode[data-color-scheme="red"] .leaflet-popup-tip {
      background: rgba(15, 40, 25, 0.7) !important;
      border-left-color: rgba(15, 255, 80, 0.6) !important;
      border-right-color: rgba(15, 255, 80, 0.6) !important;
      filter: drop-shadow(0 0 8px rgba(15, 255, 80, 0.4)) !important;
    }
    /* ==================== FIM PRESERVAÇÃO VERDE NEON ==================== */

    /* ==================== BOTÕES E ELEMENTOS INTERATIVOS - ESQUEMA VERMELHO ==================== */
    body.dark-mode[data-color-scheme="red"] button:not(.color-scheme-toggle):not(.dark-mode-toggle):not(.lite-mode-toggle):not(.whatsapp-link) { 
      background: rgba(198,40,40,0.2); 
      color: #fff; 
      border-color: #c62828;
    }
    body.dark-mode[data-color-scheme="red"] button:not(.color-scheme-toggle):not(.dark-mode-toggle):not(.lite-mode-toggle):not(.whatsapp-link):hover { 
      background: rgba(198,40,40,0.35); 
      box-shadow: 0 0 10px rgba(198,40,40,0.5);
    }
    body.dark-mode[data-color-scheme="red"] select { 
      border-color: rgba(198,40,40,0.4);
      background: #1a1a1a;
    }
    body.dark-mode[data-color-scheme="red"] select:focus {
      border-color: #c62828;
      box-shadow: 0 0 8px rgba(198,40,40,0.4);
    }
    body.dark-mode[data-color-scheme="red"] input[type="checkbox"]:checked {
      background: #c62828;
      border-color: #c62828;
    }
    body.dark-mode[data-color-scheme="red"] a:not(.whatsapp-link):not([href*="google.com"]) {
      color: #ff5f52;
    }
    body.dark-mode[data-color-scheme="red"] a:not(.whatsapp-link):not([href*="google.com"]):hover {
      color: #ff867c;
    }
    
    /* Mapas e elementos do Leaflet no esquema vermelho */
    body.dark-mode[data-color-scheme="red"] .leaflet-control-zoom a {
      background: #1a1a1a;
      border-color: #c62828;
      color: #ff5f52;
    }
    body.dark-mode[data-color-scheme="red"] .leaflet-control-zoom a:hover {
      background: rgba(198,40,40,0.2);
    }
    body.dark-mode[data-color-scheme="red"] .leaflet-bar {
      border-color: #c62828;
    }
    /* ==================== FIM ESQUEMA VERMELHO ==================== */

    /* ==================== SCROLLBAR CUSTOMIZADA UNIFICADA ==================== */
    /* Variáveis de scrollbar para tema azul */
    :root,
    [data-color-scheme="blue"] {
        --scrollbar-track-bg: rgba(30, 30, 30, 0.3);
        --scrollbar-thumb-bg: rgba(33, 150, 243, 0.4);
        --scrollbar-thumb-hover-bg: rgba(33, 150, 243, 0.6);
        --scrollbar-thumb-active-bg: rgba(33, 150, 243, 0.8);
        --scrollbar-thumb-border: rgba(33, 150, 243, 0.6);
        --scrollbar-thumb-shadow: 0 0 6px rgba(33, 150, 243, 0.5);
        --scrollbar-thumb-hover-shadow: 0 0 10px rgba(33, 150, 243, 0.8);
    }
    
    /* Variáveis de scrollbar para tema vermelho */
    [data-color-scheme="red"] {
        --scrollbar-track-bg: rgba(18, 18, 18, 0.3);
        --scrollbar-thumb-bg: rgba(198, 40, 40, 0.4);
        --scrollbar-thumb-hover-bg: rgba(198, 40, 40, 0.6);
        --scrollbar-thumb-active-bg: rgba(198, 40, 40, 0.8);
        --scrollbar-thumb-border: rgba(198, 40, 40, 0.6);
        --scrollbar-thumb-shadow: 0 0 6px rgba(198, 40, 40, 0.5);
        --scrollbar-thumb-hover-shadow: 0 0 10px rgba(198, 40, 40, 0.8);
    }

<script>
/**
 * Sistema de Gerenciamento de Esquema de Cores Unificado
 * Sincroniza o esquema de cores entre páginas Node e Java
 */
(function() {
    'use strict';
    
    const COLOR_SCHEME_KEY = 'preferredColorScheme';
    const DEFAULT_SCHEME = 'blue';
    
    function getCurrentScheme() {
        try {
            return localStorage.getItem(COLOR_SCHEME_KEY) || DEFAULT_SCHEME;
        } catch (e) {
            console.error('Erro ao ler esquema de cores:', e);
            return DEFAULT_SCHEME;
        }
    }
    
    function saveScheme(scheme) {
        try {
            localStorage.setItem(COLOR_SCHEME_KEY, scheme);
            console.log('Esquema de cores salvo:', scheme);
        } catch (e) {
            console.error('Erro ao salvar esquema de cores:', e);
        }
    }
    
    function applyScheme(scheme) {
        document.documentElement.setAttribute('data-color-scheme', scheme);
        document.body.setAttribute('data-color-scheme', scheme);
        console.log('Esquema de cores aplicado:', scheme);
        console.log('Atributo no <html>:', document.documentElement.getAttribute('data-color-scheme'));
        console.log('Atributo no <body>:', document.body.getAttribute('data-color-scheme'));
        
        const event = new CustomEvent('colorSchemeChanged', { detail: { scheme } });
        window.dispatchEvent(event);
    }
    
    function toggleScheme() {
        const current = getCurrentScheme();
        const newScheme = current === 'blue' ? 'red' : 'blue';
        saveScheme(newScheme);
        applyScheme(newScheme);
        return newScheme;
    }
    
    function initScheme() {
        const scheme = getCurrentScheme();
        applyScheme(scheme);
    }
    
    // Aplicar esquema imediatamente
    initScheme();
    
    // Exportar API global
    window.ColorScheme = {
        get: getCurrentScheme,
        set: function(scheme) {
            if (scheme === 'blue' || scheme === 'red') {
                saveScheme(scheme);
                applyScheme(scheme);
            }
        },
        toggle: toggleScheme,
        apply: applyScheme
    };
    
    console.log('Sistema de esquema de cores inicializado');
})();

// Dark Mode Toggle
const darkModeToggle = document.querySelector('.dark-mode-toggle');
const htmlElement = document.documentElement;

// Lite Mode Toggle
let liteMode = false;
const liteModeToggle = document.querySelector('.lite-mode-toggle');
liteModeToggle.addEventListener('click', () => {
  liteMode = !liteMode;
  liteModeToggle.classList.toggle('active', liteMode);
  atualizarMarcadores();
});

// Color Scheme Toggle
const colorSchemeToggle = document.querySelector('.color-scheme-toggle');
if (colorSchemeToggle) {
  colorSchemeToggle.addEventListener('click', () => {
    if (window.ColorScheme) {
      const newScheme = window.ColorScheme.toggle();
      console.log('Esquema de cores alterado para:', newScheme);
      // Notificar todos os iframes sobre a mudança de esquema
      const iframes = document.querySelectorAll('iframe');
      iframes.forEach(iframe => {
        try {
          iframe.contentWindow.postMessage({ type: 'colorSchemeChange', scheme: newScheme }, '*');
        } catch (e) {
          console.warn('Não foi possível enviar mensagem para iframe:', e);
        }
      });
    } else {
      console.error('ColorScheme não está disponível!');
    }
  });
} else {
  console.error('Botão color-scheme-toggle não encontrado!');
}

// Verificar preferência salva - Dark Mode é PADRÃO
const isDarkMode = localStorage.getItem('darkMode') !== 'false';
if(isDarkMode) {
  document.body.classList.add('dark-mode');
  darkModeToggle.textContent = '☀️';
}

// Aguardar mapa ser inicializado antes de aplicar dark mode ao mapa
if(isDarkMode) {
  setTimeout(() => {
    map.removeLayer(lightLayer);
    map.addLayer(darkLayer);
  }, 100);
}

darkModeToggle.addEventListener('click', () => {
  const isCurrentlyDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('darkMode', isCurrentlyDark ? 'true' : 'false');
  darkModeToggle.textContent = isCurrentlyDark ? '☀️' : '🌙';
  
  // Alternar camadas do mapa
  if(isCurrentlyDark) {
    map.removeLayer(lightLayer);
    map.addLayer(darkLayer);
  } else {
    map.removeLayer(darkLayer);
    map.addLayer(lightLayer);
  }
  
  // Atualizar gráfico se ele existir
  if(echartsInstance) {
    renderizarGrafico();
  }
});

const streetViewPegmanControl = document.getElementById('streetview-pegman-control');

const STREETVIEW_WINDOW_KEY = '__STREETVIEW__';
const STREETVIEW_STATE_STORAGE_KEY = 'streetViewWindowState_v1';
const STREETVIEW_DROP_CANCEL_RADIUS_PX = 44;
let _streetViewModalState = { lat: null, lng: null, url: '' };

function construirUrlStreetViewEmbed(lat, lng) {
  const latNum = Number(lat);
  const lngNum = Number(lng);
  if (!Number.isFinite(latNum) || !Number.isFinite(lngNum)) return '';
  const latStr = latNum.toFixed(6);
  const lngStr = lngNum.toFixed(6);
  return `https://maps.google.com/maps?layer=c&cbll=${encodeURIComponent(`${latStr},${lngStr}`)}&cbp=11,0,0,0,0&z=18&output=svembed`;
}

function abrirStreetViewNoModal(lat, lng) {
  const latNum = Number(lat);
  const lngNum = Number(lng);
  if (!Number.isFinite(latNum) || !Number.isFinite(lngNum)) return;
  _streetViewModalState = {
    lat: latNum,
    lng: lngNum,
    url: construirUrlStreetViewEmbed(latNum, lngNum)
  };
  mostrarPainelStreetView(latNum, lngNum);
}

function salvarEstadoStreetViewPersistido() {
  try {
    const estadoJanela = _estadoJanelasProcessamento[STREETVIEW_WINDOW_KEY] || {};
    const lat = Number(_streetViewModalState.lat);
    const lng = Number(_streetViewModalState.lng);
    const visivel = estadoJanela.visivel !== false;
    if (!visivel || !Number.isFinite(lat) || !Number.isFinite(lng)) {
      localStorage.removeItem(STREETVIEW_STATE_STORAGE_KEY);
      return;
    }
    const payload = {
      visivel: true,
      minimizada: estadoJanela.minimizada === true,
      lat,
      lng,
      url: _streetViewModalState.url || construirUrlStreetViewEmbed(lat, lng),
      updatedAt: new Date().toISOString()
    };
    localStorage.setItem(STREETVIEW_STATE_STORAGE_KEY, JSON.stringify(payload));
  } catch (_) {}
}

function carregarEstadoStreetViewPersistido() {
  try {
    const raw = localStorage.getItem(STREETVIEW_STATE_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.visivel === false) return null;
    const lat = Number(parsed.lat);
    const lng = Number(parsed.lng);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
    return {
      visivel: true,
      minimizada: parsed.minimizada === true,
      lat,
      lng,
      url: String(parsed.url || '')
    };
  } catch (_) {
    return null;
  }
}

function limparEstadoStreetViewPersistido() {
  try {
    localStorage.removeItem(STREETVIEW_STATE_STORAGE_KEY);
  } catch (_) {}
}

function restaurarJanelaStreetViewPersistida() {
  const estado = carregarEstadoStreetViewPersistido();
  if (!estado) return;

  const lat = Number(estado.lat);
  const lng = Number(estado.lng);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

  _streetViewModalState = {
    lat,
    lng,
    url: estado.url || construirUrlStreetViewEmbed(lat, lng)
  };
  _estadosMiniBarPorCidade[STREETVIEW_WINDOW_KEY] = 'streetview';
  _percentualPorCidade[STREETVIEW_WINDOW_KEY] = 100;
  atualizarEstadoJanelaCidade(STREETVIEW_WINDOW_KEY, {
    visivel: true,
    minimizada: estado.minimizada === true,
    ultimoStatus: 'streetview',
    ultimoPercentual: 100
  });

  if (estado.minimizada === true) {
    mostrarMiniBarProcessamento(STREETVIEW_WINDOW_KEY);
    return;
  }
  mostrarPainelStreetView(lat, lng);
}

function inicializarPegmanStreetView() {
  if (!streetViewPegmanControl || !streetViewPegmanHandle || !streetViewMapEl || !map) return;

  if (streetViewPegmanControl.parentElement !== streetViewMapEl) {
    streetViewMapEl.appendChild(streetViewPegmanControl);
  }

  let dragging = false;
  let ghost = null;
  let pointerIdAtivo = null;
  let origemX = null;
  let origemY = null;

  const criarGhost = () => {
    const el = document.createElement('div');
    el.className = 'streetview-ghost';
    el.innerHTML = '<span class="pegman-icon" aria-hidden="true"></span>';
    document.body.appendChild(el);
    return el;
  };

  const moverGhost = (x, y) => {
    if (!ghost) return;
    ghost.style.left = `${x}px`;
    ghost.style.top = `${y}px`;
  };

  const estaSobreMapa = (x, y) => {
    const r = streetViewMapEl.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  };

  const limparEstadoDrag = () => {
    dragging = false;
    pointerIdAtivo = null;
    origemX = null;
    origemY = null;
    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    ghost = null;
    streetViewPegmanHandle.classList.remove('dragging');
    streetViewMapEl.classList.remove('streetview-drop-ready');
    streetViewPegmanHandle.style.visibility = 'visible';
  };

  const mostrarPulsoDrop = (x, y) => {
    const pulse = document.createElement('div');
    pulse.className = 'streetview-drop-pulse';
    pulse.style.left = `${x}px`;
    pulse.style.top = `${y}px`;
    document.body.appendChild(pulse);
    setTimeout(() => { if (pulse.parentNode) pulse.parentNode.removeChild(pulse); }, 620);
  };

  const distanciaAteOrigem = (x, y) => {
    if (!Number.isFinite(origemX) || !Number.isFinite(origemY)) return Number.POSITIVE_INFINITY;
    const dx = x - origemX;
    const dy = y - origemY;
    return Math.sqrt((dx * dx) + (dy * dy));
  };

  const onPointerMove = (event) => {
    if (!dragging) return;
    if (pointerIdAtivo !== null && event.pointerId !== pointerIdAtivo) return;
    moverGhost(event.clientX, event.clientY);
    streetViewMapEl.classList.toggle('streetview-drop-ready', estaSobreMapa(event.clientX, event.clientY));
  };

  const onPointerUp = (event) => {
    if (!dragging) return;
    if (pointerIdAtivo !== null && event.pointerId !== pointerIdAtivo) return;

    const x = event.clientX;
    const y = event.clientY;
    const distanciaOrigem = distanciaAteOrigem(x, y);
    if (distanciaOrigem <= STREETVIEW_DROP_CANCEL_RADIUS_PX) {
      limparEstadoDrag();
      return;
    }
    const caiuNoMapa = estaSobreMapa(x, y);

    if (caiuNoMapa) {
      const rect = streetViewMapEl.getBoundingClientRect();
      const pontoContainer = L.point(x - rect.left, y - rect.top);
      const latLng = map.containerPointToLatLng(pontoContainer);
      mostrarPulsoDrop(x, y);
      abrirStreetViewNoModal(latLng.lat, latLng.lng);
      limparEstadoDrag();
      return;
    }

    limparEstadoDrag();
  };

  const onPointerCancel = () => {
    if (!dragging) return;
    limparEstadoDrag();
  };

  const onKeyDown = (event) => {
    if (!dragging) return;
    if (event.key !== 'Escape') return;
    event.preventDefault();
    limparEstadoDrag();
  };

  streetViewPegmanHandle.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    pointerIdAtivo = event.pointerId;
    dragging = true;
    const rectBotao = streetViewPegmanHandle.getBoundingClientRect();
    origemX = rectBotao.left + (rectBotao.width / 2);
    origemY = rectBotao.top + (rectBotao.height / 2);
    ghost = criarGhost();
    moverGhost(event.clientX, event.clientY);
    streetViewPegmanHandle.classList.add('dragging');
    streetViewPegmanHandle.style.visibility = 'hidden';
    streetViewMapEl.classList.toggle('streetview-drop-ready', estaSobreMapa(event.clientX, event.clientY));
  });

  window.addEventListener('pointermove', onPointerMove, { passive: true });
  window.addEventListener('pointerup', onPointerUp, { passive: true });
  window.addEventListener('pointercancel', onPointerCancel, { passive: true });
  document.addEventListener('keydown', onKeyDown, true);
}

// Função para remover acentos
function removerAcentos(str) {

// Carregar cidades do arquivo CSV
let cidades = [];      // nomes para autocomplete
let codigoCidades = {}; // nome.toUpperCase() → código IBGE
const _cidadesConcluidasSet = new Set();

function ordenarCidadesAutocomplete(lista = []) {
  return [...lista].sort((a, b) => {
    const aDone = _cidadesConcluidasSet.has(String(a || '').toUpperCase()) ? 1 : 0;
    const bDone = _cidadesConcluidasSet.has(String(b || '').toUpperCase()) ? 1 : 0;
    if (aDone !== bDone) return bDone - aDone;
    return String(a || '').localeCompare(String(b || ''), 'pt-BR', { sensitivity: 'base' });
  });
}

async function carregarCidadesConcluidas() {
  try {
    const response = await fetch('/api/cidades-concluidas');
    const data = await response.json();
    _cidadesConcluidasSet.clear();
    const lista = Array.isArray(data && data.cidades) ? data.cidades : [];
    for (const cidade of lista) {
      const nome = String(cidade || '').toUpperCase().trim();
      if (nome) _cidadesConcluidasSet.add(nome);
    }
  } catch (_) {
    _cidadesConcluidasSet.clear();
  }
}

async function carregarCidades() {
  try {
    const response = await fetch('/data/cidade.csv');
    const text = await response.text();
    const linhas = text.trim().split('\n');
    
    // Pular cabeçalho (linha 0)
    for (let i = 1; i < linhas.length; i++) {
      const partes = linhas[i].split(',');
      if (partes.length >= 2) {
        const codigo = partes[0].trim();
        const nome   = partes[1].trim();
        cidades.push(nome);
        codigoCidades[nome.toUpperCase()] = codigo;
      }
    }
    
    console.log(`✅ ${cidades.length} cidades carregadas`);
  } catch (e) {
    console.error('Erro ao carregar cidades:', e);
  }
}

// Inicializar autocompletar de cidades
function inicializarAutocompleteCidades() {
  const inputCidade = document.getElementById('searchCidade');
  const autocompleteList = document.getElementById('cidadeAutocomplete');
  let selecionadoIndex = -1;

  const renderizarAutocompleteCidade = (valorEntrada = '') => {
    const valor = String(valorEntrada || '').toLowerCase();
    const valorNormalizado = removerAcentos(valor);
    let cidadesFiltradas = [];

    if (!valor) {
      cidadesFiltradas = ordenarCidadesAutocomplete(cidades).slice(0, 10);
    } else {
      cidadesFiltradas = ordenarCidadesAutocomplete(
        cidades.filter(cidade => {
          const cidadeNormalizada = removerAcentos(String(cidade || '').toLowerCase());
          return cidadeNormalizada.includes(valorNormalizado);
        })
      ).slice(0, 10);
    }

    if (cidadesFiltradas.length === 0) {
      autocompleteList.style.display = 'none';
      return false;
    }

    autocompleteList.innerHTML = cidadesFiltradas.map((cidade, idx) =>
      `<div class="autocomplete-item" data-cidade="${cidade}" data-index="${idx}">${cidade}</div>`
    ).join('');
    autocompleteList.style.display = 'block';

    autocompleteList.querySelectorAll('.autocomplete-item').forEach(item => {
      item.addEventListener('click', () => {
        const cidadeSelecionada = item.getAttribute('data-cidade');
        inputCidade.value = cidadeSelecionada;
        autocompleteList.style.display = 'none';
        filtrarPorCidade(cidadeSelecionada);
      });
    });

    return true;
  };
  
  inputCidade.addEventListener('input', (e) => {
    selecionadoIndex = -1;
    renderizarAutocompleteCidade(e.target.value);
  });
  
  // Navegação por teclado no autocomplete
  inputCidade.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      inputCidade.value = '';
      autocompleteList.style.display = 'none';
      selecionadoIndex = -1;
      return;
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (autocompleteList.style.display === 'none' || !autocompleteList.querySelectorAll('.autocomplete-item').length) {
        const exibiu = renderizarAutocompleteCidade(inputCidade.value);
        if (!exibiu) return;
      }
      const items = autocompleteList.querySelectorAll('.autocomplete-item');
      selecionadoIndex = Math.min(selecionadoIndex + 1, items.length - 1);
      items.forEach((item, i) => item.classList.toggle('selected', i === selecionadoIndex));
      if (items[selecionadoIndex]) items[selecionadoIndex].scrollIntoView({ block: 'nearest' });
      return;
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const items = autocompleteList.querySelectorAll('.autocomplete-item');
      if (!items.length || autocompleteList.style.display === 'none') return;
      selecionadoIndex = Math.max(selecionadoIndex - 1, 0);
      items.forEach((item, i) => item.classList.toggle('selected', i === selecionadoIndex));
      if (items[selecionadoIndex]) items[selecionadoIndex].scrollIntoView({ block: 'nearest' });
      return;
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const items = autocompleteList.querySelectorAll('.autocomplete-item');
      if (!items.length || autocompleteList.style.display === 'none') return;
      if (selecionadoIndex >= 0 && selecionadoIndex < items.length) {
        const cidadeSelecionada = items[selecionadoIndex].getAttribute('data-cidade');
        inputCidade.value = cidadeSelecionada;
        autocompleteList.style.display = 'none';
        selecionadoIndex = -1;
        filtrarPorCidade(cidadeSelecionada);
      }
      return;
    } else {
      return;
    }
  });

  // Fechar autocomplete ao clicar fora
  document.addEventListener('click', (e) => {
    if (e.target !== inputCidade && !autocompleteList.contains(e.target)) {
      autocompleteList.style.display = 'none';
    }
  });
}

function isStreetViewWindow(nomeJanela) {
  return String(nomeJanela || '').toUpperCase() === STREETVIEW_WINDOW_KEY;
}

function isInstanceFormWindow(nomeJanela) {
  const chave = String(nomeJanela || '').toUpperCase();
  return chave.startsWith(INSTANCES_WINDOW_KEY_PREFIX);
}

function isPlanificationWindow(nomeJanela) {
  const chave = String(nomeJanela || '').toUpperCase();

}

function obterMapaCidadesAquecidas() {
  try {
    const raw = localStorage.getItem(WARMED_CITIES_STORAGE_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : {};
  } catch (_) {
    return {};
  }
}

function cidadeAquecida(nomeCidade) {
  const nome = normalizarNomeCidadeStorage(nomeCidade);
  if (!nome) return false;
  const mapa = obterMapaCidadesAquecidas();
  return mapa[nome] === true;
}

function marcarCidadeAquecida(nomeCidade) {
  const nome = normalizarNomeCidadeStorage(nomeCidade);
  if (!nome) return;
  try {
    const mapa = obterMapaCidadesAquecidas();
    if (mapa[nome] === true) return;
    mapa[nome] = true;
    localStorage.setItem(WARMED_CITIES_STORAGE_KEY, JSON.stringify(mapa));
  } catch (_) {}
}

function normalizarNomeCidadeStorage(nomeCidade) {
  return String(nomeCidade || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .trim();
}

function salvarUltimaCidadeMapa(nomeCidade) {
  const nome = normalizarNomeCidadeStorage(nomeCidade);
  if (!nome) return;
  try {
    localStorage.setItem(LAST_CITY_STORAGE_KEY, nome);
  } catch (_) {}
}

function obterUltimaCidadeMapa() {
  try {
    const raw = localStorage.getItem(LAST_CITY_STORAGE_KEY);
    return normalizarNomeCidadeStorage(raw || '');
  } catch (_) {
    return '';
  }
}

function resolverNomeCidadePersistida(nomeCidadePersistida) {
  const nomeNormalizado = normalizarNomeCidadeStorage(nomeCidadePersistida);
  if (!nomeNormalizado) return '';
  if (!Array.isArray(cidades) || !cidades.length) return nomeNormalizado;

  const encontrada = cidades.find((nome) => normalizarNomeCidadeStorage(nome) === nomeNormalizado);
  return encontrada || nomeNormalizado;
}

function carregarEstadoJanelasProcessamento() {
  try {
    const raw = localStorage.getItem(PROCESS_WINDOWS_STATE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    if (!parsed || typeof parsed !== 'object') {
      _estadoJanelasProcessamento = {};
      return;
    }
    const saneado = {};
    Object.entries(parsed).forEach(([nome, estado]) => {
      const chave = String(nome || '').toUpperCase();
      if (!chave || isStreetViewWindow(chave)) return;
      saneado[chave] = estado;
    });
    _estadoJanelasProcessamento = saneado;
  } catch (_) {
    _estadoJanelasProcessamento = {};
  }
}

function salvarEstadoJanelasProcessamento() {
  try {
    const persistivel = {};
    Object.entries(_estadoJanelasProcessamento || {}).forEach(([nome, estado]) => {
      const chave = String(nome || '').toUpperCase();
      if (!chave || isStreetViewWindow(chave)) return;
      persistivel[chave] = estado;
    });
    localStorage.setItem(PROCESS_WINDOWS_STATE_KEY, JSON.stringify(persistivel));
  } catch (_) {}
}

function atualizarEstadoJanelaCidade(cidade, patch = {}) {
  if (!cidade) return;
  const nome = cidade.toUpperCase();
  const atual = _estadoJanelasProcessamento[nome] || { minimizada: false, visivel: true, updatedAt: new Date().toISOString() };
  _estadoJanelasProcessamento[nome] = {
    ...atual,
    ...patch,
    updatedAt: new Date().toISOString()
  };
  if (isStreetViewWindow(nome)) salvarEstadoStreetViewPersistido();
  salvarEstadoJanelasProcessamento();
  sincronizarMiniBarrasProcessamentos();
}

function sincronizarMiniBarrasProcessamentos() {
  const nomes = Object.keys(_estadoJanelasProcessamento || {});
  for (const cidade of nomes) {
    const estado = _estadoJanelasProcessamento[cidade] || {};
    const ultimoStatus = String(estado.ultimoStatus || '').toLowerCase();
    const estadoMiniBar = _estadosMiniBarPorCidade[cidade] || '';
    const ativo = (
      estadoMiniBar === 'processing'
      || estadoMiniBar === 'paused'
      || estadoMiniBar === 'failed'
      || estadoMiniBar === 'streetview'
      || ultimoStatus === 'processing'
      || ultimoStatus === 'paused'
      || ultimoStatus === 'failed'
      || ultimoStatus === 'streetview'
    );

    if (estado.visivel === false || !ativo) {
      ocultarMiniBarProcessamento(cidade);
      continue;
    }

    if (estado.minimizada === true) {
      mostrarMiniBarProcessamento(cidade);
    } else {
      ocultarMiniBarProcessamento(cidade);
    }
  }
}

  controles.appendChild(btnMax);
  controles.appendChild(btnClose);

  obterContainerMiniBarras().appendChild(bar);
  return bar;
}

    const formState = _instanceFormStates[cidadeNome];
    if (formState) {
      const tipoNomes = {
        'COMMITTEE': '🏢 COMITÊ',
        'COUNCIL': '🏛️ CONSELHO',

      };
      return tipoNomes[formState.type] || '📝 INSTÂNCIA';

  }
  if (estado === 'planification') {

  if (estado === 'paused') return `⏸️ ${cidadeNome} (Pausado)`;
  return `<span class="processamento-rotating-icon">⚙</span> ${cidadeNome}`;

function controlarNavegacaoTab(e) {
  if (e.key !== 'Tab') return;

  const overlay = document.getElementById('processamento-overlay');
  const overlayInner = document.getElementById('overlay-inner');
  const modalAberto = !!overlay && overlay.style.display !== 'none' && elementoEstaVisivel(overlay);

  let focaveis = [];
  if (modalAberto && overlayInner) {
    focaveis = obterElementosFocaveis(overlayInner);
  } else {
    focaveis = obterElementosNavegaveisSidebar();
  }

  if (!focaveis.length) return;

  const ativo = document.activeElement;
  const indiceAtual = focaveis.indexOf(ativo);
  const direcao = e.shiftKey ? -1 : 1;
  let proximoIndice;

  if (indiceAtual === -1) {
    proximoIndice = direcao === 1 ? 0 : focaveis.length - 1;
  } else {
    proximoIndice = (indiceAtual + direcao + focaveis.length) % focaveis.length;
  }

  e.preventDefault();
  focaveis[proximoIndice].focus({ preventScroll: false });
}

function limparSelecaoOverlay() {
  overlayPadraoState.buttons.forEach(btn => {
    btn.classList.remove('overlay-btn-selected');
    btn.removeAttribute('data-overlay-selected');
  });
  overlayPadraoState.buttons = [];
  overlayPadraoState.selectedIndex = -1;
}

function atualizarSelecaoOverlay() {
  overlayPadraoState.buttons.forEach((btn, index) => {
    const ativo = index === overlayPadraoState.selectedIndex;
    btn.classList.toggle('overlay-btn-selected', ativo);
    if (ativo) {
      btn.setAttribute('data-overlay-selected', 'true');
      btn.focus({ preventScroll: true });
    } else {
      btn.removeAttribute('data-overlay-selected');
    }
  });
}

function configurarOverlayPadrao({
  selectedIndex = 0,
  navButtonsSelector = '[data-overlay-nav-group] button',
  closeOnEscape = true,
  closeOnOutsideClick = true
} = {}) {
  const inner = document.getElementById('overlay-inner');
  if (!inner) return;

  overlayPadraoState.closeOnEscape = closeOnEscape;
  overlayPadraoState.closeOnOutsideClick = closeOnOutsideClick;
  overlayPadraoState.buttons = Array.from(inner.querySelectorAll(navButtonsSelector))
    .filter(btn => !btn.disabled && btn.offsetParent !== null);

  if (!overlayPadraoState.buttons.length) {
    overlayPadraoState.selectedIndex = -1;
    return;
  }

  const maxIndex = overlayPadraoState.buttons.length - 1;
  overlayPadraoState.selectedIndex = Math.max(0, Math.min(maxIndex, selectedIndex));
  atualizarSelecaoOverlay();
}

function inicializarOverlayPadrao() {
  const overlay = document.getElementById('processamento-overlay');
  if (!overlay) return;
  if (overlayPadraoState.initialized) return;
  overlayPadraoState.initialized = true;

  document.addEventListener('keydown', controlarNavegacaoTab, true);

  overlay.addEventListener('click', (e) => {
    if (!overlayPadraoState.closeOnOutsideClick) return;
    if (e.target === overlay) fecharOverlay();
  });

  document.addEventListener('keydown', (e) => {
    const overlayEl = document.getElementById('processamento-overlay');
    if (!overlayEl || overlayEl.style.display === 'none') return;

    const isStreetViewMode = overlayEl.dataset.overlayMode === 'streetview';
    if (e.key === 'Escape' && (overlayPadraoState.closeOnEscape || isStreetViewMode)) {
      e.preventDefault();
      fecharOverlay();
      return;
    }

    if (!overlayPadraoState.buttons.length) return;

    const isHorizontalArrow = e.key === 'ArrowLeft' || e.key === 'ArrowRight';
    if (isHorizontalArrow) {
      e.preventDefault();
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      const total = overlayPadraoState.buttons.length;
      overlayPadraoState.selectedIndex = (overlayPadraoState.selectedIndex + dir + total) % total;
      atualizarSelecaoOverlay();
      return;
    }

    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      const btn = overlayPadraoState.buttons[overlayPadraoState.selectedIndex];
      if (btn) btn.click();
    }
  });

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('#overlay-inner [data-overlay-nav-group] button');
    if (!btn || !overlayPadraoState.buttons.length) return;
    const index = overlayPadraoState.buttons.indexOf(btn);
    if (index >= 0) {
      overlayPadraoState.selectedIndex = index;
      atualizarSelecaoOverlay();
    }
  });

  document.addEventListener('focusin', (e) => {
    const btn = e.target.closest('#overlay-inner [data-overlay-nav-group] button');
    if (!btn || !overlayPadraoState.buttons.length) return;
    const index = overlayPadraoState.buttons.indexOf(btn);
    if (index >= 0) {
      overlayPadraoState.selectedIndex = index;
      atualizarSelecaoOverlay();
    }
  });
}

// Formata segundos em "Xh Ym Zs", "Xm Ys" ou "Xs"
function fmtSecs(s) {
  if (!s && s !== 0) return '—';
  const total = Math.max(0, Math.floor(Number(s) || 0));
  if (total < 60) return `${total}s`;
  if (total < 3600) return `${Math.floor(total / 60)}m ${total % 60}s`;
  const horas = Math.floor(total / 3600);
  const minutos = Math.floor((total % 3600) / 60);
  const segundos = total % 60;
  return `${horas}h ${minutos}m ${segundos}s`;
}

// Traduz stage code para label legível
function fmtStage(stage) {
  const m = { INIT:'Inicializando', CONTANDO:'Contando linhas dos arquivos',
              AGUARDANDO:'Aguardando início', ESTABELE:'Processando ESTABELECIMENTOS',
              EMPRE:'Processando EMPRESAS', SOCIO:'Processando SÓCIOS',
              CONCLUIDO:'Concluído', CANCELADO:'Cancelado', PAUSADO:'Pausado', ERRO:'Falha no processamento' };
  return m[stage] || stage || '—';
}

function calcularPercentualArquivos(progressData) {
  const filesDone = Number.isFinite(progressData && progressData.files_done) ? progressData.files_done : NaN;
  const totalFiles = Number.isFinite(progressData && progressData.total_files) && progressData.total_files > 0
    ? progressData.total_files
    : NaN;
  if (Number.isFinite(filesDone) && Number.isFinite(totalFiles) && totalFiles > 0) {
    return Math.max(0, Math.min(100, (100 * filesDone / totalFiles)));
  }
  if (Number.isFinite(progressData && progressData.percent)) {
    return Math.max(0, Math.min(100, Number(progressData.percent)));
  }
  return 0;
}

function criarAnimadorProgressoSuave({ initialPct = 0, onRender = () => {} } = {}) {
  const state = {
    displayPct: Math.max(0, Math.min(100, Number(initialPct) || 0)),
    realPct: Math.max(0, Math.min(100, Number(initialPct) || 0)),
    movimentoPct: Math.max(0, Math.min(100, Number(initialPct) || 0)),
    velocidadePctPorSeg: 0,
    allowComplete: false,
    ativo: false,
    rafId: null,
    lastTs: 0
  };

  const step = (ts) => {
    if (!state.ativo) return;
    const dt = state.lastTs ? Math.min(0.05, (ts - state.lastTs) / 1000) : 0.016;
    state.lastTs = ts;

    const real = Math.max(0, Math.min(100, state.realPct));
    const movAtual = state.movimentoPct;

    let capAnimacao;
    if (state.allowComplete) {
      capAnimacao = 100;
    } else {
      let lead = 10;
      if (real >= 30) lead = 7;
      if (real >= 60) lead = 5;
      if (real >= 80) lead = 3.2;
      if (real >= 92) lead = 2.2;
      if (real >= 95) lead = 1.25;
      if (real >= 98) lead = 0.65;

      const atrasoParaReal = Math.max(0, real - movAtual);
      const bonus = Math.min(3.5, atrasoParaReal * 0.35);
      capAnimacao = Math.min(99.4, Math.max(movAtual, real + lead + bonus));

      if (movAtual > 95) {
        const excesso = movAtual - 95;
        const freioTopo = 99.45 - Math.min(1.1, Math.pow(excesso, 1.08) * 0.08);
        capAnimacao = Math.min(capAnimacao, freioTopo);
      }
    }

    const distanciaAteCap = capAnimacao - state.movimentoPct;
    if (distanciaAteCap > 0.0001) {
      const fatorDist = Math.max(0, Math.min(1, distanciaAteCap / 6));
      const aceleracaoBase = state.allowComplete ? 18 : 14;
      const aceleracao = aceleracaoBase * (0.25 + 0.75 * fatorDist);
      state.velocidadePctPorSeg += aceleracao * dt;

      let velocidadeMax = (state.allowComplete ? 28 : 20) * (0.35 + 0.65 * fatorDist);
      if (!state.allowComplete && state.movimentoPct > 95) {
        velocidadeMax *= 0.45;
      }
      state.velocidadePctPorSeg = Math.min(state.velocidadePctPorSeg, velocidadeMax);

      if (distanciaAteCap < 1.2) {
        state.velocidadePctPorSeg *= 0.90;
      }

      state.movimentoPct += state.velocidadePctPorSeg * dt;
      if (state.movimentoPct > capAnimacao) {
        state.movimentoPct = capAnimacao;
        state.velocidadePctPorSeg *= 0.35;
      }
    } else {
      state.movimentoPct = capAnimacao;
      state.velocidadePctPorSeg *= 0.72;
    }

    const alvoVisual = state.movimentoPct;
    const atualVisual = state.displayPct;
    const deltaVisual = alvoVisual - atualVisual;
    state.displayPct = Math.max(atualVisual, atualVisual + deltaVisual * Math.min(1, 0.22 + dt * 8));
    if (state.allowComplete && state.realPct >= 100 && state.movimentoPct >= 99.98) {
      state.displayPct = 100;
    }

    onRender(state.displayPct, state);
    state.rafId = requestAnimationFrame(step);
  };

  const start = () => {
    if (state.ativo) return;
    state.ativo = true;
    state.lastTs = 0;
    onRender(state.displayPct, state);
    state.rafId = requestAnimationFrame(step);
  };

  const stop = () => {
    state.ativo = false;
    if (state.rafId) {
      cancelAnimationFrame(state.rafId);
      state.rafId = null;
    }
  };

  const setTarget = (targetPct, { allowComplete = false } = {}) => {
    const pct = Math.max(0, Math.min(100, Number(targetPct) || 0));
    state.realPct = Math.max(state.realPct, pct);
    if (allowComplete) state.allowComplete = true;
    if (!state.ativo) start();
  };

  const reset = (pct = 0) => {
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    state.displayPct = p;
    state.realPct = p;
    state.movimentoPct = p;
    state.velocidadePctPorSeg = 0;
    state.allowComplete = false;
    onRender(state.displayPct, state);
  };

  const waitFor = async (minPct = 99.8, timeoutMs = 2500, shouldContinue = () => true) => {
    const inicio = Date.now();
    while ((Date.now() - inicio) < timeoutMs) {
      if (!shouldContinue()) return;
      if (state.displayPct >= minPct) return;
      await new Promise(resolve => setTimeout(resolve, 16));
    }
  };

  return {
    setTarget,
    reset,
    stop,
    waitFor,
    getDisplayPct: () => state.displayPct
  };
}

let _animBarArquivos = null;
let _animBarLinhas = null;

function garantirAnimadoresPainelProcessamento() {
  if (!_animBarArquivos) {
    _animBarArquivos = criarAnimadorProgressoSuave({
      onRender: (pct) => {
        const elBar = document.getElementById('prog-bar');
        const elPct = document.getElementById('prog-pct');
        if (elBar) elBar.style.width = `${pct.toFixed(2)}%`;
        if (elPct) elPct.textContent = `${pct.toFixed(2)}%`;
      }
    });
  }
  if (!_animBarLinhas) {
    _animBarLinhas = criarAnimadorProgressoSuave({
      onRender: (pct) => {
        const elProcBar = document.getElementById('prog-proc-bar');
        const elProcPct = document.getElementById('prog-proc-pct');
        if (elProcBar) elProcBar.style.width = `${pct.toFixed(2)}%`;
        if (elProcPct) elProcPct.textContent = `${pct.toFixed(2)}%`;
      }
    });
  }
}

function anexarLinhasLog(lines = []) {
  const logEl = document.getElementById('prog-log');
  if (!logEl || !lines.length) return;
  const shouldStick = (logEl.scrollTop + logEl.clientHeight) >= (logEl.scrollHeight - 24);
  const colorized = lines.map(line => {
    const escaped = line
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    const isPause = /\[PAUSA\]|PAUSADO/i.test(line);
    const isResume = /\[RETOMADA\]|RETOMADO/i.test(line);
    const isErro = /\[ERRO|FALHA|ERRO_PROCESSO|\[STDERR\].*(erro|error|falha)/i.test(line);

    if (isErro) return `<span class="log-line-error">${escaped}</span>`;
    if (isPause) return `<span class="log-line-pause">${escaped}</span>`;
    if (isResume) return `<span class="log-line-resume">${escaped}</span>`;
    return escaped;
  });
  logEl.innerHTML += colorized.join('<br>') + '<br>';
  if (shouldStick) logEl.scrollTop = logEl.scrollHeight;
}

function iniciarPollingLog(nomeCidade) {
  if (_logPollingInterval) clearInterval(_logPollingInterval);
  const pollLog = async () => {
    try {
      const r = await fetch(`/api/log-cidade?nome=${encodeURIComponent(nomeCidade)}&offset=${_logOffset}`);
      const d = await r.json();
      if (Array.isArray(d.lines) && d.lines.length) anexarLinhasLog(d.lines);
      if (Number.isFinite(d.nextOffset)) _logOffset = d.nextOffset;
    } catch (e) {
      console.warn('Falha ao atualizar log:', e.message);
    }
  };
  pollLog();
  _logPollingInterval = setInterval(pollLog, 2000);
}

function resetarHistoricoRecursos() {
  _historicoRecursos.cpu = [];

  _historicoRecursos.gpuMem = [];
}

function adicionarPontoHistorico(lista, valor, indisponivel = false) {
  if (!Array.isArray(lista)) return;
  if (indisponivel || !Number.isFinite(valor)) lista.push(null);
  else lista.push(Math.max(0, Math.min(100, Number(valor))));
  if (lista.length > _maxHistoricoRecursos) {
    lista.splice(0, lista.length - _maxHistoricoRecursos);
  }
}

function gerarPathSerie(serie, largura = 100, altura = 34, padding = 2) {
  if (!Array.isArray(serie) || !serie.length) return '';
  const denom = Math.max(1, serie.length - 1);
  let d = '';
  let iniciou = false;

  for (let i = 0; i < serie.length; i++) {
    const v = serie[i];
    if (!Number.isFinite(v)) {
      iniciou = false;
      continue;
    }
    const x = (i / denom) * largura;
    const y = padding + ((100 - v) / 100) * (altura - (padding * 2));
    d += `${iniciou ? 'L' : 'M'}${x.toFixed(2)} ${y.toFixed(2)} `;
    iniciou = true;
  }

  return d.trim();
}

function renderizarMiniGraficoTemporal(svgId, serie, cor) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  const path = gerarPathSerie(serie);
  svg.innerHTML = `
    <rect x="0.5" y="0.5" width="99" height="33" rx="3" fill="rgba(11,17,32,0.72)" stroke="rgba(159,179,255,0.30)"></rect>
    <line x1="0" y1="17" x2="100" y2="17" stroke="rgba(159,179,255,0.16)" stroke-width="1"></line>
    ${path ? `<path d="${path}" fill="none" stroke="${cor}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></path>` : ''}
  `;
}

}

// Atualiza todo o painel de progresso com os dados de /api/progresso-cidade
function atualizarPainelProgresso(d, cidadeRef = _cidadeAtiva) {
  const cidadeNome = (cidadeRef || _cidadeAtiva || '').toUpperCase();
  const elStage    = document.getElementById('prog-stage');
  const elFile     = document.getElementById('prog-file');
  const elFiles    = document.getElementById('prog-files');
  const elProcInfo = document.getElementById('prog-lines-processed');
  const elETA      = document.getElementById('prog-eta');
  const elElapsed  = document.getElementById('prog-elapsed');
  const elFileProg = document.getElementById('prog-file-progress');
  if (!elStage) return;
  const filesDone = Number.isFinite(d.files_done) ? d.files_done : 0;
  const totalFiles = Number.isFinite(d.total_files) && d.total_files > 0 ? d.total_files : 30;
  const filePct = Math.max(0, Math.min(100, (100 * filesDone / totalFiles)));
  const linhasProcessadas = Number.isFinite(d.lines_done) ? d.lines_done : 0;
  const linhasTotais = Number.isFinite(d.total_lines) ? d.total_lines : 0;
  const etapaContagem = String(d.stage || '').toUpperCase() === 'CONTANDO';
  const procPct = (!etapaContagem && linhasTotais > 0)
    ? Math.max(0, Math.min(100, (100 * linhasProcessadas / linhasTotais)))
    : 0;
  garantirAnimadoresPainelProcessamento();
  const concluido = String(d.stage || '').toUpperCase() === 'CONCLUIDO' || String(d.status || '').toLowerCase() === 'done';
  if (_animBarArquivos && _animBarArquivos.getDisplayPct() > (filePct + 0.25)) {
    _animBarArquivos.reset(filePct);
  }
  if (_animBarLinhas && _animBarLinhas.getDisplayPct() > (procPct + 0.25)) {
    _animBarLinhas.reset(procPct);
  }
  if (_animBarArquivos) _animBarArquivos.setTarget(filePct, { allowComplete: concluido });
  if (_animBarLinhas) _animBarLinhas.setTarget(procPct, { allowComplete: concluido });

  if (elStage)    elStage.textContent    = fmtStage(d.stage);
  if (elFile)     elFile.textContent     = d.current_file ? `📄 ${d.current_file}` : '';
  if (elFileProg && d.file_lines_total > 0) {
    const fp = Math.round(100 * (d.file_lines_done||0) / d.file_lines_total);
    elFileProg.textContent = `Arquivo: ${(d.file_lines_done||0).toLocaleString()} / ${d.file_lines_total.toLocaleString()} linhas (${fp}%)`;
  }
  if (elFiles)    elFiles.textContent    = `Arquivos: ${filesDone} / ${totalFiles}`;
  if (elProcInfo) {
    elProcInfo.textContent = etapaContagem
      ? 'Linhas processadas: aguardando fim da contagem total...'
      : `Linhas processadas: ${linhasProcessadas.toLocaleString()} / ${linhasTotais.toLocaleString()}`;
  }
  _percentualProcessamentoAtual = filePct;
  if (cidadeNome) {
    _percentualPorCidade[cidadeNome] = filePct;
    atualizarEstadoJanelaCidade(cidadeNome, {
      ultimoPercentual: filePct,
      ultimoStatus: (_estadosMiniBarPorCidade[cidadeNome] === 'paused') ? 'paused' : 'processing'
    });
  }
  if (_overlayMinimizado && cidadeNome) atualizarMiniBarProcessamento(cidadeNome);
  if (elETA)      elETA.textContent      = `ETA: ${fmtSecs(d.eta_secs)}`;
  if (elElapsed)  elElapsed.textContent  = `Decorrido: ${fmtSecs(d.elapsed_secs)}`;
}

// Inicia polling a cada 10 segundos
function iniciarPollingProgresso(nomeCidade) {
  const cidadeNome = (nomeCidade || '').toUpperCase();
  if (!cidadeNome) return;
  const pollingSeq = ++_pollingCidadeSeq;
  _cidadeAtiva = cidadeNome;
  aplicarEstadoProcessandoUI(cidadeNome);
  atualizarEstadoJanelaCidade(cidadeNome, { visivel: true });
  if (_overlayMinimizado) mostrarMiniBarProcessamento(cidadeNome);
  if (_pollingInterval) clearInterval(_pollingInterval);
  iniciarPollingLog(nomeCidade);
  iniciarPollingRecursos(nomeCidade);

  const poll = async () => {
    try {
      const r = await fetch(`/api/progresso-cidade?nome=${encodeURIComponent(nomeCidade)}`);
      const d = await r.json();
      if (pollingSeq !== _pollingCidadeSeq || _cidadeAtiva !== cidadeNome) return;
      _ultimoStatusProcessamento = d.status || 'running';
      _percentualPorCidade[cidadeNome] = calcularPercentualArquivos(d);
      atualizarPainelProgresso(d, cidadeNome);
      const isConcluido  = d.status === 'done' && !d.emProcessamento;
      const isCancelado  = d.status === 'cancelled' && !d.emProcessamento;
      const isPausado    = d.status === 'paused' && !d.emProcessamento;
      const isFalha      = d.status === 'failed' && !d.emProcessamento;
      if (isConcluido) {
        _estadosMiniBarPorCidade[cidadeNome] = 'done';
        clearInterval(_pollingInterval); _pollingInterval = null; _jobAtivo = false;
        _pollingCidadeSeq++;
        if (_logPollingInterval) { clearInterval(_logPollingInterval); _logPollingInterval = null; }
        if (_recursosPollingInterval) { clearInterval(_recursosPollingInterval); _recursosPollingInterval = null; }
        delete _estadoJanelasProcessamento[cidadeNome];
        salvarEstadoJanelasProcessamento();
        removerMiniBarProcessamento(cidadeNome);
        exibirPainelFinal('done', nomeCidade);
        return;
      }
      if (isCancelado) {
        _estadosMiniBarPorCidade[cidadeNome] = 'cancelled';
        clearInterval(_pollingInterval); _pollingInterval = null; _jobAtivo = false;
        _pollingCidadeSeq++;
        if (_logPollingInterval) { clearInterval(_logPollingInterval); _logPollingInterval = null; }
        if (_recursosPollingInterval) { clearInterval(_recursosPollingInterval); _recursosPollingInterval = null; }
        delete _estadoJanelasProcessamento[cidadeNome];
        salvarEstadoJanelasProcessamento();
        removerMiniBarProcessamento(cidadeNome);
        exibirPainelFinal('cancelled', nomeCidade);
        return;
      }
      if (isFalha) {
        _estadosMiniBarPorCidade[cidadeNome] = 'failed';
        clearInterval(_pollingInterval); _pollingInterval = null; _jobAtivo = false;
        _pollingCidadeSeq++;
        if (_logPollingInterval) { clearInterval(_logPollingInterval); _logPollingInterval = null; }
        if (_recursosPollingInterval) { clearInterval(_recursosPollingInterval); _recursosPollingInterval = null; }
        atualizarMiniBarProcessamento(cidadeNome);
        exibirPainelFinal('failed', nomeCidade);
        return;
      }
      if (isPausado) {
        aplicarEstadoPausadoUI(cidadeNome, d);
        anexarLinhasLog([
          `[PAUSA] Processamento pausado em ${d.current_file || 'arquivo não informado'} na linha ${d.file_lines_done || 0}.`
        ]);
        return;
      }
      aplicarEstadoProcessandoUI(cidadeNome, d);
      // Mostrar botão cancelar apenas enquanto processando
      const btnCancel = document.getElementById('btn-cancelar');
      if (btnCancel) btnCancel.style.display = d.emProcessamento ? 'inline-flex' : 'none';
      const btnPausar = document.getElementById('btn-pausar');
      const btnRetomar = document.getElementById('btn-retomar');
      if (btnPausar) btnPausar.style.display = d.emProcessamento ? 'inline-flex' : 'none';
      if (btnRetomar) btnRetomar.style.display = 'none';
      atualizarMiniBarProcessamento(cidadeNome);
    } catch(e) {
      console.warn('Polling falhou, tentando novamente...', e.message);
    }
  };
  poll(); // imediato na primeira vez
  _pollingInterval = setInterval(poll, 10000);
}

function exibirPainelFinal(tipo, nomeCidade) {
  const overlay = document.getElementById('processamento-overlay');
  const inner = document.getElementById('overlay-inner');
  if (!inner) return;
  if (tipo === 'failed') _miniBarEstado = 'failed';
  if (_overlayMinimizado) {
    mostrarMiniBarProcessamento(nomeCidade);
  } else {
    if (overlay) overlay.style.display = 'flex';
    _overlayMinimizado = false;
    ocultarMiniBarProcessamento(nomeCidade);
  }
  if (tipo === 'done') {
    // Carregar e exibir a cidade no mapa automaticamente
    carregarCidadeNoMapa(nomeCidade);
  } else if (tipo === 'cancelled') {
    inner.innerHTML = `
      <div style="text-align:center;padding:32px 0">
        <div style="font-size:48px;margin-bottom:12px">🚫</div>
        <div style="font-size:18px;font-weight:700;color:#f44336">Processamento cancelado</div>

        <div data-overlay-nav-group style="display:flex;justify-content:center">

        </div>
      </div>`;
  } else {
    inner.innerHTML = `
      <div style="text-align:center;padding:32px 0">
        <div style="font-size:48px;margin-bottom:12px">⚠️</div>
        <div style="font-size:18px;font-weight:700;color:#ff9800">Falha no processamento</div>
        <div style="font-size:13px;color:#aaa;margin-top:8px">Verifique o log detalhado da cidade <strong style="color:#fff">${nomeCidade}</strong> para identificar o ponto de erro.</div>
        <div data-overlay-nav-group style="display:flex;justify-content:center">
          <button onclick="fecharOverlay()" style="margin-top:24px;padding:10px 28px;background:#555;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600">Fechar</button>
        </div>
      </div>`;
  }
  configurarOverlayPadrao({ selectedIndex: 0 });

  const loadingKey = `${PLANIFICATION_WINDOW_KEY_PREFIX}loading_${Date.now()}`;

  minimizarOutrasJanelasProcessamento(loadingKey);
  _cidadeAtiva = loadingKey;

  if (cityName) params.append('cityName', cityName);
  if (name) params.append('name', name);
  
  // Detectar estado via geocodificação reversa (OpenStreetMap/Nominatim)
  let _estadoDetectado = null;
  const _empMatch = empresas.find(e => e.cnpj === cnpj);
  const _empCoords = _empMatch && _empMatch.coordenadas;
  const _detectEstado = (_empCoords && Number.isFinite(_empCoords.lat) && Number.isFinite(_empCoords.lon))
    ? fetch(`https://nominatim.openstreetmap.org/reverse?lat=${_empCoords.lat}&lon=${_empCoords.lon}&format=json&addressdetails=1`, { headers: { 'Accept-Language': 'pt-BR' } })
      .then(r => r.json()).then(d => (d && d.address && d.address.state) || null).catch(() => null)
    : Promise.resolve(null);
  
  _detectEstado.then(estadoGeo => {
    _estadoDetectado = estadoGeo;
    if (estadoGeo) {
      console.log('🌍 Estado detectado via geocodificação:', estadoGeo);
      params.append('state', estadoGeo);
    }
    return fetch(`/api/factories/find-or-create?${params.toString()}`, { method: 'POST' });
  })
  .then(response => {
    console.log('📡 Resposta recebida:', response.status, response.statusText);
    if (!response.ok) {
      return response.text().then(errorText => {
        console.error('❌ Erro da API:', errorText);
        throw new Error(errorText || `Erro ${response.status}: ${response.statusText}`);
      });
    }
    return response.json();
  })
  .then(factory => {
    console.log('✅ Fábrica obtida:', factory);
    
    if (!factory || !factory.id) {
      throw new Error('Fábrica sem ID');
    }
    
    // Se o estado não foi resolvido nem pelo banco nem pela geocodificação, perguntar ao usuário
    if (!factory.state && !_estadoDetectado) {
      const _cidadePrompt = cityName || factory.cityName || '';
      const _userState = prompt('A qual Estado a cidade ' + _cidadePrompt + ' pertence?');
      if (_userState && _userState.trim()) {
        // Reenviar com o estado informado pelo usuário para criar o conselho estadual

          _conselhosGlobaisCarregados = false;

function fecharOverlay() {
  if (_jobAtivo) {
    minimizarOverlay();
    return;
  }

  const cidadeFechada = _cidadeAtiva;
  if (isStreetViewWindow(cidadeFechada)) {
    atualizarEstadoJanelaCidade(cidadeFechada, { visivel: false });
    removerMiniBarProcessamento(cidadeFechada);
    delete _estadosMiniBarPorCidade[cidadeFechada];
    delete _percentualPorCidade[cidadeFechada];
    limparEstadoStreetViewPersistido();
    _streetViewModalState = { lat: null, lng: null, url: '' };
  }

  const overlay = document.getElementById('processamento-overlay');
  if (overlay) overlay.style.display = 'none';
  _overlayMinimizado = false;
  ocultarMiniBarProcessamento(_cidadeAtiva);
  sincronizarMiniBarrasProcessamentos();
  _miniBarEstado = 'processing';
  limparSelecaoOverlay();
  if (_pollingInterval) { clearInterval(_pollingInterval); _pollingInterval = null; }
  _pollingCidadeSeq++;
  if (_logPollingInterval) { clearInterval(_logPollingInterval); _logPollingInterval = null; }
  if (_recursosPollingInterval) { clearInterval(_recursosPollingInterval); _recursosPollingInterval = null; }
  if (_animBarArquivos) _animBarArquivos.stop();
  if (_animBarLinhas) _animBarLinhas.stop();
  _logOffset = 0;
  _cidadeAtiva = null;
  _codigoCidadeAtiva = null;
  _jobAtivo = false;

  if (_deveRetornarFocoBuscaCidade) {
    const inputCidade = document.getElementById('searchCidade');
    if (inputCidade) {
      inputCidade.focus({ preventScroll: true });
      const fim = inputCidade.value.length;
      inputCidade.setSelectionRange(0, fim);
    }
    _deveRetornarFocoBuscaCidade = false;
  }
}
