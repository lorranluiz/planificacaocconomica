# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/planecon
spring.datasource.username=postgres
spring.datasource.password=planecon123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configurações de cache do Hibernate
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider

# Estatísticas do Hibernate (desativar em produção)
spring.jpa.properties.hibernate.generate_statistics=true

# Configurações do pool de conexões
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Configurações de performance do PostgreSQL
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

# Configurações específicas do PostgreSQL
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Server Configuration - HTTPS na porta 443 (padrão HTTPS)
server.port=443
server.ssl.key-store=classpath:keystore/planecon.p12
server.ssl.key-store-password=planecon123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=planecon
server.ssl.enabled=true

# Hot reload (manter para desenvolvimento)
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=0.5s

# Configurações de conteúdo estático
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Configurações de erro - simplificadas
server.error.whitelabel.enabled=false
