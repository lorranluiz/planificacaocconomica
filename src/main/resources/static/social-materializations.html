<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
    // Aplicar tema imediatamente no carregamento da página
    (function() {
        try {
            const savedTheme = localStorage.getItem('preferredTheme') || 'ocean';
            document.documentElement.setAttribute('data-theme', savedTheme);
            console.log('Tema aplicado em social-materializations.html:', savedTheme);
        } catch(e) {
            console.error('Erro ao aplicar tema inicial:', e);
        }
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" id="theme-color" content="#2c3e50">
    <!-- Desabilitar cache para sempre carregar versão atualizada -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="/css/theme-variables.css">
    <link rel="stylesheet" href="/css/theme-elements.css">
    <title>Materializações Sociais - Sistema de Planejamento Econômico</title>
    <link rel="stylesheet" href="/css/common-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Garantir que o cabeçalho comum seja inserido
        if (typeof window.insertCommonHeader === 'function') {
            window.insertCommonHeader();
        } else {
            console.error("Função insertCommonHeader não encontrada");
        }
        
        // Garantir que o tema seja aplicado assim que a página carregar
        if (typeof window.applyThemeToEntirePage === 'function') {
            const savedTheme = localStorage.getItem('preferredTheme') || 'ocean';
            window.applyThemeToEntirePage(savedTheme);
        }
        
        // Adicionar ouvinte para evento de mudança de tema
        document.addEventListener('themeChanged', function(event) {
            console.log("Evento 'themeChanged' detectado:", event.detail.theme);
            if (typeof window.applyThemeToEntirePage === 'function') {
                window.applyThemeToEntirePage(event.detail.theme);
            }
        });
    });
    </script>
    <div class="container">
        <!-- O cabeçalho será inserido aqui pelo script -->

        <h1>Materializações Sociais</h1>
        
        <!-- Abas para navegar entre listar e cadastrar -->
        <div class="tabs">
            <div class="tab active" data-tab="list">Listar</div>
            <div class="tab" data-tab="create">Cadastrar</div>
        </div>
        
        <!-- Conteúdo da aba de listagem -->
        <div id="list-tab" class="tab-content active">
            <button id="loadButton">Carregar Materializações</button>
            
            <div id="loading" class="loading">Carregando dados...</div>
            <div id="error" class="message error"></div>
            <div id="counter" class="counter"></div>
            
            <div id="results">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Qtd. Padrão</th>
                            <th>Unidade</th>
                            <th>Setor</th>
                            <th>Criado em</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <!-- Conteúdo da aba de cadastro -->
        <div id="create-tab" class="tab-content">
            <div id="formLoadingMessage" class="loading">Carregando setores...</div>
            <div id="formErrorMessage" class="message error"></div>
            <div id="formSuccessMessage" class="message success"></div>
            
            <form id="createForm" class="form-container">
                <h2>Nova Materialização Social</h2>
                
                <div class="form-group">
                    <label for="name">Nome<span class="required">*</span></label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="type">Tipo<span class="required">*</span></label>
                    <select id="type" name="type" required>
                        <option value="">Selecione...</option>
                        <option value="SERVICE">SERVIÇO</option>
                        <option value="PRODUCT">PRODUTO</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="sector">Setor<span class="required">*</span></label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select id="sector" name="sector" required style="flex: 1">
                            <option value="">Carregando setores...</option>
                        </select>
                        <button type="button" class="secondary" style="min-width: 80px" onclick="window.location.href = '/sectors.html?_t=' + Date.now() + '#create'">Novo</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Grandeza Padrão<span class="required">*</span></label>
                    <div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 220px;">
                            <label for="standardQuantityPerUnit" style="font-size: 0.9rem; margin-bottom: 6px; display: block;">Quantidade Padrão de 1 unidade</label>
                            <input type="number" id="standardQuantityPerUnit" name="standardQuantityPerUnit" step="any" min="0" placeholder="Ex.: 1, 0.5, 2.75" required>
                        </div>
                        <div style="flex: 1; min-width: 220px;">
                            <label for="measurementUnit" style="font-size: 0.9rem; margin-bottom: 6px; display: block;">Unidade de Medida</label>
                            <select id="measurementUnit" name="measurementUnit" required>
                                <option value="">Carregando unidades...</option>
                            </select>
                        </div>
                        <div id="unitButtonsNormal" style="display: flex; gap: 8px; align-items: flex-end;">
                            <button type="button" id="newUnitButton" class="secondary">Nova Unidade</button>
                            <button type="button" id="prepareDeleteUnitButton" class="danger">Excluir uma Unidade</button>
                        </div>
                        <div id="unitButtonsDeleteMode" style="display: none; align-items: flex-end;">
                            <button type="button" id="confirmDeleteUnitButton" class="danger">Excluir</button>
                        </div>
                    </div>
                    <div id="newUnitInputContainer" style="display: none; margin-top: 10px;">
                        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                            <input type="text" id="newUnitInput" placeholder="Digite a nova unidade" maxlength="30" style="max-width: 280px;">
                            <button type="button" id="saveNewUnitButton" class="secondary">Salvar Unidade</button>
                        </div>
                    </div>
                </div>
                
                <div class="form-buttons">
                    <button type="button" id="cancelButton" class="danger">Cancelar</button>
                    <button type="submit" id="submitButton">Cadastrar</button>
                </div>
            </form>
        </div>
    </div> <!-- Fechamento do container -->
    <script src="/common-header.js"></script>
    <script>
        // Função principal de inicialização
        function initializePage() {
            console.log('[INIT] Iniciando página social-materializations.html');
            
            // Inserir o cabeçalho comum
            if (typeof insertCommonHeader === 'function') {
                insertCommonHeader();
            }
            
            // Elementos da página
            const loadButton = document.getElementById('loadButton');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const tableBody = document.querySelector('#dataTable tbody');
            const counter = document.getElementById('counter');
            const createForm = document.getElementById('createForm');
            const formLoadingMessage = document.getElementById('formLoadingMessage');
            const formErrorMessage = document.getElementById('formErrorMessage');
            const formSuccessMessage = document.getElementById('formSuccessMessage');
            const sectorSelect = document.getElementById('sector');
            const measurementUnitSelect = document.getElementById('measurementUnit');
            const standardQuantityPerUnitInput = document.getElementById('standardQuantityPerUnit');
            const submitButton = document.getElementById('submitButton');
            const cancelButton = document.getElementById('cancelButton');
            const newUnitButton = document.getElementById('newUnitButton');
            const prepareDeleteUnitButton = document.getElementById('prepareDeleteUnitButton');
            const confirmDeleteUnitButton = document.getElementById('confirmDeleteUnitButton');
            const saveNewUnitButton = document.getElementById('saveNewUnitButton');
            const unitButtonsNormal = document.getElementById('unitButtonsNormal');
            const unitButtonsDeleteMode = document.getElementById('unitButtonsDeleteMode');
            const newUnitInputContainer = document.getElementById('newUnitInputContainer');
            const newUnitInput = document.getElementById('newUnitInput');
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');

            let isDeleteUnitMode = false;
            let cachedUnits = [];
            
            console.log('[INIT] Número de abas encontradas:', tabs.length);
            console.log('[INIT] Número de tab-contents encontrados:', tabContents.length);
            
            // Função para ativar a aba de cadastro
            function activateCreateTab() {
                console.log('[TAB] Ativando aba de CADASTRO...');
                
                // Remover classe ativa de todas as abas
                tabs.forEach(t => {
                    const tabName = t.getAttribute('data-tab');
                    console.log('[TAB] Removendo active da aba:', tabName);
                    t.classList.remove('active');
                });
                
                tabContents.forEach(c => {
                    console.log('[TAB] Removendo active do conteúdo:', c.id);
                    c.classList.remove('active');
                });
                
                // Ativar aba de cadastro
                const createTab = document.querySelector('.tab[data-tab="create"]');
                const createTabContent = document.getElementById('create-tab');
                
                console.log('[TAB] createTab encontrada?', !!createTab);
                console.log('[TAB] createTabContent encontrado?', !!createTabContent);
                
                if (createTab && createTabContent) {
                    createTab.classList.add('active');
                    createTabContent.classList.add('active');
                    
                    console.log('[TAB] ✅ Aba CADASTRAR ativada!');
                    console.log('[TAB] Classe da aba:', createTab.className);
                    console.log('[TAB] Classe do conteúdo:', createTabContent.className);
                    console.log('[TAB] Display do conteúdo:', window.getComputedStyle(createTabContent).display);
                    
                    // Carregar setores para o formulário de cadastro
                    loadSectors();
                    loadMeasurementUnits();
                } else {
                    console.error('[TAB] ❌ Erro: elementos da aba não encontrados!');
                }
            }
            
            // ----------------- GERENCIAMENTO DE ABAS -----------------
            console.log('[TAB] Registrando event listeners das abas...');
            tabs.forEach((tab, index) => {
                const tabId = tab.getAttribute('data-tab');
                console.log(`[TAB] Registrando listener para aba ${index}: ${tabId}`);
                
                tab.addEventListener('click', function(e) {
                    console.log(`[TAB] Clique na aba: ${tabId}`);
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Remover classe ativa de todas as abas
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    // Adicionar classe ativa na aba clicada
                    this.classList.add('active');
                    const targetTabContent = document.getElementById(tabId + '-tab');
                    if (targetTabContent) {
                        targetTabContent.classList.add('active');
                        console.log(`[TAB] ✅ Aba ${tabId} ativada!`);
                    } else {
                        console.error(`[TAB] ❌ Conteúdo da aba ${tabId}-tab não encontrado!`);
                    }
                    
                    // Se a aba for de cadastro, carregar setores
                    if (tabId === 'create') {
                        loadSectors();
                        loadMeasurementUnits();
                    } else if (tabId === 'list') {
                        loadMaterializations();
                    }
                });
            });

            newUnitButton.addEventListener('click', () => {
                newUnitInputContainer.style.display = 'block';
                newUnitInput.focus();
            });

            saveNewUnitButton.addEventListener('click', async () => {
                const name = newUnitInput.value.trim();
                if (!name) {
                    formErrorMessage.textContent = 'Digite o nome da nova unidade.';
                    formErrorMessage.style.display = 'block';
                    return;
                }

                formErrorMessage.style.display = 'none';
                try {
                    const response = await fetch('/api/measurement-units', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name })
                    });

                    const payload = await response.json();
                    if (!response.ok) {
                        throw new Error(payload.message || 'Erro ao cadastrar unidade');
                    }

                    await loadMeasurementUnits(payload.id);
                    newUnitInput.value = '';
                    newUnitInputContainer.style.display = 'none';
                } catch (err) {
                    formErrorMessage.textContent = 'Erro ao cadastrar unidade: ' + err.message;
                    formErrorMessage.style.display = 'block';
                }
            });

            prepareDeleteUnitButton.addEventListener('click', () => {
                if (!cachedUnits.length) {
                    formErrorMessage.textContent = 'Não há unidades para excluir.';
                    formErrorMessage.style.display = 'block';
                    return;
                }
                isDeleteUnitMode = true;
                formErrorMessage.style.display = 'none';
                newUnitInputContainer.style.display = 'none';
                unitButtonsNormal.style.display = 'none';
                unitButtonsDeleteMode.style.display = 'flex';
                measurementUnitSelect.innerHTML = '<option value="">Escolha uma unidade para excluir</option>';
                cachedUnits.forEach(unit => {
                    const option = document.createElement('option');
                    option.value = unit.id;
                    option.textContent = unit.name;
                    measurementUnitSelect.appendChild(option);
                });
            });

            confirmDeleteUnitButton.addEventListener('click', async () => {
                const selectedId = parseInt(measurementUnitSelect.value, 10);
                if (!selectedId) {
                    formErrorMessage.textContent = 'Escolha uma unidade para excluir.';
                    formErrorMessage.style.display = 'block';
                    return;
                }

                formErrorMessage.style.display = 'none';
                try {
                    const response = await fetch(`/api/measurement-units/${selectedId}`, {
                        method: 'DELETE'
                    });
                    const payload = await response.json();
                    if (!response.ok) {
                        throw new Error(payload.message || 'Erro ao excluir unidade');
                    }

                    isDeleteUnitMode = false;
                    unitButtonsDeleteMode.style.display = 'none';
                    unitButtonsNormal.style.display = 'flex';
                    await loadMeasurementUnits();
                } catch (err) {
                    formErrorMessage.textContent = 'Erro ao excluir unidade: ' + err.message;
                    formErrorMessage.style.display = 'block';
                }
            });
            
            // Verificar se deve abrir a aba de cadastro (via hash #create)
            const currentHash = window.location.hash;
            console.log('[HASH] URL completa:', window.location.href);
            console.log('[HASH] Hash da URL:', currentHash);
            console.log('[HASH] Deve abrir aba de cadastro?', currentHash === '#create');

            loadMeasurementUnits();
            
            if (currentHash === '#create') {
                // Usar setTimeout para garantir que o CSS esteja aplicado
                setTimeout(function() {
                    console.log('[HASH] Executando activateCreateTab por causa do hash #create');
                    activateCreateTab();
                }, 150);
            } else {
                // Carregar dados automaticamente ao abrir a página (apenas se não for cadastro)
                loadMaterializations();
            }
            
            // ----------------- LISTAR MATERIALIZAÇÕES -----------------
            loadButton.addEventListener('click', loadMaterializations);
            
            function loadMaterializations() {
                // Limpar resultados anteriores
                tableBody.innerHTML = '';
                counter.textContent = '';
                
                // Mostrar indicador de carregamento
                loading.style.display = 'block';
                
                // Esconder mensagem de erro
                error.style.display = 'none';
                
                // Fazer requisição ao endpoint
                fetch('/api/social-materializations/full')
                    .then(response => {
                        if (!response.ok) {
                            // Tentar extrair mensagem de erro se disponível
                            return response.text().then(text => {
                                let errorMsg = `Status: ${response.status}`;
                                try {
                                    // Verificar se é JSON válido
                                    const errorObj = JSON.parse(text);
                                    if (errorObj && errorObj.message) {
                                        errorMsg = errorObj.message;
                                    }
                                } catch (e) {
                                    // Se não for JSON, usar o texto como está ou o código de status
                                    if (text && text.trim()) {
                                        errorMsg = text;
                                    }
                                }
                                throw new Error(errorMsg);
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        // Tratar dados vazios
                        if (!data || data.length === 0) {
                            counter.textContent = 'Nenhuma materialização social encontrada.';
                            loading.style.display = 'none';
                            return;
                        }

                        // Esconder indicador de carregamento
                        loading.style.display = 'none';
                        
                        // Atualizar contador
                        counter.textContent = `Total: ${data.length} materializações encontradas`;
                        
                        // Preencher a tabela com os dados
                        data.forEach(item => {
                            const row = document.createElement('tr');
                            
                            // Formatar a data de criação
                            let createdAt = item.createdAt || '';
                            if (createdAt && createdAt.includes('T')) {
                                const date = new Date(createdAt);
                                createdAt = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                            }
                            
                            // Adicionar células
                            row.innerHTML = `
                                <td>${item.id || ''}</td>
                                <td>${item.name || ''}</td>
                                <td>${formatType(item.type) || ''}</td>
                                <td>${formatNumber(item.standardQuantityPerUnit) || '-'}</td>
                                <td>${item.measurementUnitName || '-'}</td>
                                <td>${item.sector ? item.sector.name : (item.sectorName || '-')}</td>
                                <td>${createdAt || '-'}</td>
                            `;
                            
                            tableBody.appendChild(row);
                        });
                    })
                    .catch(err => {
                        // Esconder indicador de carregamento
                        loading.style.display = 'none';
                        
                        // Mostrar erro detalhado
                        console.error("Erro completo:", err);
                        error.textContent = 'Erro ao carregar dados: ' + err.message;
                        error.style.display = 'block';
                    });
            }

                async function loadMeasurementUnits(preferredUnitId = null) {
                    measurementUnitSelect.innerHTML = '<option value="">Carregando unidades...</option>';
                    measurementUnitSelect.disabled = true;
                    try {
                        const response = await fetch('/api/measurement-units');
                        if (!response.ok) {
                            throw new Error(`Falha ao carregar unidades: ${response.status}`);
                        }

                        const units = await response.json();
                        cachedUnits = Array.isArray(units) ? units : [];

                        measurementUnitSelect.innerHTML = isDeleteUnitMode
                            ? '<option value="">Escolha uma unidade para excluir</option>'
                            : '<option value="">Selecione uma unidade...</option>';

                        cachedUnits.forEach(unit => {
                            const option = document.createElement('option');
                            option.value = unit.id;
                            option.textContent = unit.name;
                            measurementUnitSelect.appendChild(option);
                        });

                        if (preferredUnitId) {
                            measurementUnitSelect.value = String(preferredUnitId);
                        }

                        measurementUnitSelect.disabled = false;
                    } catch (err) {
                        console.error('Erro ao carregar unidades:', err);
                        formErrorMessage.textContent = 'Erro ao carregar unidades: ' + err.message;
                        formErrorMessage.style.display = 'block';
                        measurementUnitSelect.innerHTML = '<option value="">Erro ao carregar unidades</option>';
                    }
                }
            
            // ----------------- CARREGAR SETORES -----------------
            async function loadSectors() {
                formLoadingMessage.style.display = 'block';
                formErrorMessage.style.display = 'none';
                sectorSelect.innerHTML = '<option value="">Carregando setores...</option>';
                sectorSelect.disabled = true;
                
                try {
                    const response = await fetch('/api/sectors');
                    
                    if (!response.ok) {
                        // Melhor tratamento de erro
                        const errorText = await response.text();
                        let errorMsg = `Falha ao carregar setores: ${response.status}`;
                        
                        try {
                            const errorObj = JSON.parse(errorText);
                            if (errorObj && errorObj.message) {
                                errorMsg = errorObj.message;
                            }
                        } catch (e) {
                            if (errorText && errorText.trim()) {
                                errorMsg = errorText;
                            }
                        }
                        
                        throw new Error(errorMsg);
                    }
                    
                    const sectors = await response.json();
                    
                    // Verificar se há setores
                    if (!sectors || sectors.length === 0) {
                        formErrorMessage.textContent = 'Nenhum setor disponível para seleção.';
                        formErrorMessage.style.display = 'block';
                        sectorSelect.innerHTML = '<option value="">Nenhum setor disponível</option>';
                        formLoadingMessage.style.display = 'none';
                        return;
                    }
                    
                    // Preencher o select de setores
                    sectorSelect.innerHTML = '<option value="">Selecione um setor...</option>';
                    sectors.forEach(sector => {
                        const option = document.createElement('option');
                        option.value = sector.id;
                        option.textContent = sector.name;
                        sectorSelect.appendChild(option);
                    });
                    
                    sectorSelect.disabled = false;
                    formLoadingMessage.style.display = 'none';
                } catch (err) {
                    console.error("Erro ao carregar setores:", err);
                    formErrorMessage.textContent = 'Erro ao carregar setores: ' + err.message;
                    formErrorMessage.style.display = 'block';
                    formLoadingMessage.style.display = 'none';
                    sectorSelect.innerHTML = '<option value="">Erro ao carregar</option>';
                }
            }
            
            // ----------------- CADASTRAR MATERIALIZAÇÃO -----------------
            createForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Obter dados do formulário
                const formData = {
                    name: document.getElementById('name').value,
                    type: document.getElementById('type').value,
                    sectorId: parseInt(document.getElementById('sector').value),
                    standardQuantityPerUnit: standardQuantityPerUnitInput.value,
                    measurementUnitId: parseInt(measurementUnitSelect.value)
                };
                
                // Validação básica
                if (!formData.name || !formData.type || !formData.sectorId || !formData.standardQuantityPerUnit || !formData.measurementUnitId) {
                    formErrorMessage.textContent = 'Por favor, preencha todos os campos obrigatórios.';
                    formErrorMessage.style.display = 'block';
                    return;
                }
                
                // Enviar dados ao servidor
                submitMaterialization(formData);
            });
            
            async function submitMaterialization(formData) {
                // Desabilitar o botão de envio e mostrar carregamento
                submitButton.disabled = true;
                formLoadingMessage.textContent = 'Cadastrando materialização...';
                formLoadingMessage.style.display = 'block';
                formSuccessMessage.style.display = 'none';
                formErrorMessage.style.display = 'none';
                
                try {
                    const response = await fetch('/api/social-materializations', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });
                    
                    const responseData = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(responseData.message || 'Erro ao cadastrar materialização');
                    }
                    
                    // Mostrar mensagem de sucesso
                    formSuccessMessage.textContent = 'Materialização social cadastrada com sucesso!';
                    formSuccessMessage.style.display = 'block';
                    
                    // Limpar o formulário
                    createForm.reset();
                    await loadMeasurementUnits();
                    newUnitInputContainer.style.display = 'none';
                    isDeleteUnitMode = false;
                    unitButtonsDeleteMode.style.display = 'none';
                    unitButtonsNormal.style.display = 'flex';
                    
                    // Após 3 segundos, redirecionar para a aba de listagem
                    setTimeout(() => {
                        document.querySelector('.tab[data-tab="list"]').click();
                        loadMaterializations(); // Recarregar a lista
                    }, 3000);
                    
                } catch (err) {
                    formErrorMessage.textContent = 'Erro ao cadastrar: ' + err.message;
                    formErrorMessage.style.display = 'block';
                    console.error(err);
                } finally {
                    submitButton.disabled = false;
                    formLoadingMessage.style.display = 'none';
                }
            }
            
            // Botão cancelar limpa o formulário
            cancelButton.addEventListener('click', function() {
                createForm.reset();
                formErrorMessage.style.display = 'none';
                formSuccessMessage.style.display = 'none';
                newUnitInputContainer.style.display = 'none';
                isDeleteUnitMode = false;
                unitButtonsDeleteMode.style.display = 'none';
                unitButtonsNormal.style.display = 'flex';
                document.querySelector('.tab[data-tab="list"]').click();
            });
            
            // ----------------- UTILITÁRIOS -----------------
            function formatType(type) {
                if (type === 'SERVICE') return 'SERVIÇO';
                if (type === 'PRODUCT') return 'PRODUTO';
                return type;
            }

            function formatNumber(value) {
                if (value === undefined || value === null || value === '') {
                    return '';
                }
                const number = Number(value);
                if (Number.isNaN(number)) {
                    return String(value);
                }
                return number.toLocaleString('pt-BR', {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 6
                });
            }
        }
        
        // Chamar a função de inicialização
        // Verificar se o DOM já está carregado ou aguardar
        if (document.readyState === 'loading') {
            console.log('[INIT] DOM ainda carregando, aguardando DOMContentLoaded...');
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            console.log('[INIT] DOM já carregado, inicializando imediatamente...');
            initializePage();
        }
    </script>

        // Verificar tema

    <script>
    // Script de verificação e forçamento de tema
    (function() {
        // Função para aplicar tema diretamente
        function applyThemeDirectly(theme) {
            console.log(`Aplicando tema ${theme} diretamente em social-materializations.html`);
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('preferredTheme', theme);
            
            // Forçar repintagem para aplicar o tema
            document.documentElement.style.display = 'none';
            void document.documentElement.offsetHeight;
            document.documentElement.style.display = '';
        }

        // Verificar quando a página terminar de carregar
        window.addEventListener('load', function() {
            console.log("Página social-materializations.html completamente carregada");
            
            // Verificar tema
            const savedTheme = localStorage.getItem('preferredTheme') || 'ocean';
            const currentTheme = document.documentElement.getAttribute('data-theme');
            
            if (currentTheme !== savedTheme) {
                console.warn(`Tema inconsistente! Atual: ${currentTheme}, Salvo: ${savedTheme}`);
                applyThemeDirectly(savedTheme);
            }
            
            // Adicionar evento global para detectar mudanças de tema
            document.addEventListener('themeChanged', function(event) {
                applyThemeDirectly(event.detail.theme);
            });
            
            // Configurar eventos para as opções de tema na página
            document.querySelectorAll('.theme-option').forEach(option => {
                option.addEventListener('click', function() {
                    const theme = this.getAttribute('data-theme');
                    if (theme) {
                        applyThemeDirectly(theme);
                    }
                });
            });
        });
    })();
    </script>

    <!-- Listener para navegação de volta quando dentro de modal -->
    <script>
    (function() {
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'navigateBack') {
                console.log('[SOCIAL-MAT] Recebida mensagem para voltar');
                window.history.back();
            }
        });
    })();
    </script>
