<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
    // Aplicar tema imediatamente no carregamento da página
    (function() {
        try {
            const savedTheme = localStorage.getItem('preferredTheme') || 'ocean';
            document.documentElement.setAttribute('data-theme', savedTheme);
            console.log('Tema aplicado em demand-vectors.html:', savedTheme);
        } catch(e) {
            console.error("Erro ao aplicar tema:", e);
        }
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" id="theme-color" content="#2c3e50">
    <link rel="stylesheet" href="/css/theme-variables.css">
    <link rel="stylesheet" href="/css/theme-elements.css">
    <title>Vetores de Demanda - Sistema de Planejamento Econômico</title>
    <link rel="stylesheet" href="/css/common-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            margin-right: 5px;
            border-radius: 5px 5px 0 0;
        }
        
        .tab.active {
            background-color: var(--card-bg);
            border-color: var(--border-color);
            border-bottom-color: var(--card-bg);
            color: var(--accent-color);
            position: relative;
            bottom: -1px;
        }
        
        .tab-content {
            display: none;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 5px 5px;
            background: var(--card-bg);
        }
        
        .tab-content.active {
            display: block;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        table th, table td {
            padding: 10px;
            border: 1px solid var(--border-color);
            text-align: left;
        }
        
        table th {
            background-color: var(--table-header-bg);
            color: var(--table-header-color);
        }
        
        form {
            margin: 20px 0;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--text-color);
        }
        
        input[type="number"] {
            width: calc(100% - 16px);
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        
        button:hover {
            background-color: var(--primary-hover);
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        
        .alert-success {
            background-color: var(--success-bg);
            color: var(--success-text);
        }
        
        .alert-error {
            background-color: var(--error-bg);
            color: var(--error-text);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- O cabeçalho será inserido aqui pelo script -->

        <h1><i class="fas fa-project-diagram"></i> Vetores de Demanda</h1>
        
        <!-- Abas para navegar entre listar e cadastrar -->
        <div class="tabs">
            <div class="tab active" data-tab="list">Listar</div>
            <div class="tab" data-tab="create">Cadastrar</div>
        </div>
        
        <!-- Conteúdo da aba Listar -->
        <div id="list-content" class="tab-content active">
            <div id="list-loading">Carregando...</div>
            <div id="list-error" style="display: none;" class="alert alert-error"></div>
            <table id="demand-vectors-table">
                <thead>
                    <tr>
                        <th>Materialização Social</th>
                        <th>Tipo</th>
                        <th>Instância</th>
                        <th>Demanda</th>
                        <th>Data de Criação</th>
                    </tr>
                </thead>
                <tbody id="demand-vectors-list">
                    <!-- Os dados serão inseridos aqui -->
                </tbody>
            </table>
        </div>
        
        <!-- Conteúdo da aba Cadastrar -->
        <div id="create-content" class="tab-content">
            <form id="create-form">
                <div id="create-success" style="display: none;" class="alert alert-success">
                    Registro criado com sucesso!
                </div>
                <div id="create-error" style="display: none;" class="alert alert-error"></div>
                
                <div class="form-group">
                    <label for="materializations">Materialização Social:</label>
                    <select id="materializations" name="materializationId" required>
                        <option value="">Selecione uma materialização</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="instances">Instância:</label>
                    <select id="instances" name="instanceId" required>
                        <option value="">Selecione uma instância</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="demand">Demanda:</label>
                    <input type="number" id="demand" name="demand" step="0.01" min="0" required>
                </div>
                
                <button type="submit" id="submit-button">
                    <span>Salvar</span>
                    <span id="submit-loading" class="loading" style="display: none;"></span>
                </button>
            </form>
        </div>
        
    </div>

    <script src="/common-header.js"></script>
    <script>
        // Inicializar o cabeçalho
        document.addEventListener('DOMContentLoaded', function() {
            insertCommonHeader();
            
            // Configurar as abas
            setupTabs();
            
            // Carregar dados
            loadDemandVectors();
            loadMaterializations();
            loadInstances();
            
            // Configurar o formulário
            setupForm();
        });
        
        // Funções para manipulação das abas
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    const tabContents = document.querySelectorAll('.tab-content');
                    tabContents.forEach(content => content.classList.remove('active'));
                    
                    const tabId = tab.getAttribute('data-tab');
                    document.getElementById(`${tabId}-content`).classList.add('active');
                });
            });
        }
        
        // Função para carregar e exibir a lista de vetores de demanda
        async function loadDemandVectors() {
            try {
                const response = await fetch('/api/demand-vectors');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                const tableBody = document.getElementById('demand-vectors-list');
                tableBody.innerHTML = '';
                
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    
                    tr.innerHTML = `
                        <td>${item.socialMaterialization ? item.socialMaterialization.name : '-'}</td>
                        <td>${item.socialMaterialization ? item.socialMaterialization.type : '-'}</td>
                        <td>${item.instance ? item.instance.name : '-'}</td>
                        <td>${item.demand}</td>
                        <td>${formatDate(item.createdAt)}</td>
                    `;
                    
                    tableBody.appendChild(tr);
                });
                
                document.getElementById('list-loading').style.display = 'none';
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('list-loading').style.display = 'none';
                document.getElementById('list-error').style.display = 'block';
                document.getElementById('list-error').textContent = `Erro ao carregar dados: ${error.message}`;
            }
        }
        
        // Função para carregar as materializações sociais
        async function loadMaterializations() {
            try {
                const response = await fetch('/api/social-materializations');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                const select = document.getElementById('materializations');
                select.innerHTML = '<option value="">Selecione uma materialização</option>';
                
                data.forEach(material => {
                    const option = document.createElement('option');
                    option.value = material.id;
                    option.textContent = `${material.name} (${material.type})`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('create-error').style.display = 'block';
                document.getElementById('create-error').textContent = `Erro ao carregar materializações: ${error.message}`;
            }
        }
        
        // Função para carregar as instâncias
        async function loadInstances() {
            try {
                const response = await fetch('/api/instances');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                const select = document.getElementById('instances');
                select.innerHTML = '<option value="">Selecione uma instância</option>';
                
                data.forEach(instance => {
                    let name;
                    // Verificar o tipo da instância
                    if (instance.type === "COMMITTEE" && instance.committeeName) {
                        name = instance.committeeName;
                    } else if (instance.type === "COUNCIL") {
                        name = `Council ${instance.id}`;
                    } else {
                        name = `Instância #${instance.id}`;
                    }
                    
                    const option = document.createElement('option');
                    option.value = instance.id;
                    option.textContent = name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('create-error').style.display = 'block';
                document.getElementById('create-error').textContent = `Erro ao carregar instâncias: ${error.message}`;
            }
        }
        
        // Função para configurar o formulário
        function setupForm() {
            const form = document.getElementById('create-form');
            
            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                
                // Esconder mensagens anteriores
                document.getElementById('create-success').style.display = 'none';
                document.getElementById('create-error').style.display = 'none';
                
                const submitButton = document.getElementById('submit-button');
                const loadingSpinner = document.getElementById('submit-loading');
                
                submitButton.disabled = true;
                submitButton.querySelector('span').style.display = 'none';
                loadingSpinner.style.display = 'inline-block';
                
                try {
                    const formData = new FormData(form);
                    const data = {
                        materializationId: parseInt(formData.get('materializationId')),
                        instanceId: parseInt(formData.get('instanceId')),
                        demand: parseFloat(formData.get('demand'))
                    };
                    
                    const response = await fetch('/api/demand-vectors', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                    }
                    
                    // Limpar formulário
                    form.reset();
                    
                    // Mostrar mensagem de sucesso
                    document.getElementById('create-success').style.display = 'block';
                    
                    // Recarregar a lista
                    loadDemandVectors();
                    
                } catch (error) {
                    console.error('Error:', error);
                    document.getElementById('create-error').style.display = 'block';
                    document.getElementById('create-error').textContent = `Erro: ${error.message}`;
                } finally {
                    submitButton.disabled = false;
                    submitButton.querySelector('span').style.display = 'inline';
                    loadingSpinner.style.display = 'none';
                }
            });
        }
        
        // Função para formatar data
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return '-';
            
            return date.toLocaleString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>
</body>
</html>
